    logActivity("order_flag", `Changed ${order.id} flag from ${orderFlagLabel(currentFlag)} to ${orderFlagLabel(adminFlag)}`);
  }

  function saveOrderTracking(order) {
    if (!order) return;
    const shippingCompany = String(order.shippingCompany || "").trim();
    const trackingNumber = String(order.trackingNumber || "").trim();
    if (!shippingCompany || !trackingNumber) {
      alert(lang==="th" ? "กรุณากรอกบริษัทขนส่งและเลขพัสดุ" : "Please enter shipping company and tracking number.");
      return;
    }
    const nextStatus = ["delivered","cancelled"].includes(order.status) ? order.status : "shipped";
    const event = makeOrderEvent("tracking", lang==="th" ? `บันทึกเลขพัสดุ ${shippingCompany}: ${trackingNumber}${nextStatus==="shipped" ? " และเปลี่ยนเป็นกำลังจัดส่ง" : ""}` : `Saved tracking ${shippingCompany}: ${trackingNumber}${nextStatus==="shipped" ? " and moved to shipping" : ""}`);
    const changedAt = new Date().toISOString();
    const nextOrders = orders.map(o=>o.id===order.id?attachShippingRecord({...o, shippingCompany, trackingNumber, trackingUpdatedAt:changedAt, status:nextStatus, statusUpdatedAt:changedAt, updatedAt:changedAt, timeline:[event, ...(Array.isArray(o.timeline) ? o.timeline : [])].slice(0, 80)}):o);
    setOrders(nextOrders);
    queueImmediateOnlineSave("order_tracking_saved", { orders: nextOrders });
    setDetailOrder(prev=>prev && prev.id===order.id ? attachShippingRecord({ ...prev, shippingCompany, trackingNumber, trackingUpdatedAt:changedAt, status:nextStatus, statusUpdatedAt:changedAt, updatedAt:changedAt, timeline:[event, ...(Array.isArray(prev.timeline) ? prev.timeline : [])].slice(0, 80) }) : prev);
    logActivity("tracking_update", `Saved tracking for ${order.id}: ${shippingCompany} ${trackingNumber}${nextStatus==="shipped" ? " and moved to shipping" : ""}`);
    alert(lang==="th" ? "บันทึกเลขพัสดุแล้ว ลูกค้าจะเห็นในประวัติคำสั่งซื้อ" : "Tracking saved. Customer can see it in order history.");
  }

  function copyTrackingNumber(trackingNumber) {
    const text = String(trackingNumber || "").trim();
    if (!text) return;
    const done = () => alert(lang==="th" ? "คัดลอกเลขพัสดุแล้ว" : "Tracking number copied");
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => {});
      return;
    }
    const box = document.createElement("textarea");
    box.value = text;
    box.style.position = "fixed";
    box.style.opacity = "0";
    document.body.appendChild(box);
    box.focus();
    box.select();
    document.execCommand("copy");
    box.remove();
    done();
  }

  function cancelOrder(order) {
    if (!order || order.status === "cancelled") return;
    const ok = window.confirm(lang==="th" ? `ยกเลิกออเดอร์ ${order.id}? ออเดอร์จะยังอยู่ในประวัติ` : `Cancel order ${order.id}? It will stay in history.`);
    if (!ok) return;
    updateOrderStatus(order, "cancelled");
  }

  function restoreCancelledOrder(order) {
    if (!order || order.status !== "cancelled") return;
    updateOrderStatus(order, "pending");
  }

  function labelSafe(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
  }

  function setIncomeMonthRange(value) {
    setIncomeMonth(value);
    if (value === "all") {
      setIncomeStartDate("");
      setIncomeEndDate("");
      return;
    }
    const [year, month] = value.split("-").map(Number);
    const lastDay = new Date(year, month, 0).getDate();
    const mm = String(month).padStart(2, "0");
    setIncomeStartDate(`${year}-${mm}-01`);
    setIncomeEndDate(`${year}-${mm}-${String(lastDay).padStart(2, "0")}`);
  }

  async function restoreBackupFile(event) {
    const file = event.target.files?.[0];
    event.target.value = "";
    if (!file) return;
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      if (!backup || !Array.isArray(backup.brands) || !Array.isArray(backup.orders) || !Array.isArray(backup.customers) || !Array.isArray(backup.accounts)) {
        throw new Error("Invalid backup");
      }
      const ok = window.confirm(lang==="th" ? "กู้คืนข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันจะถูกแทนที่" : "Restore this backup? Current preview data will be replaced.");
      if (!ok) return;
      setBrands(backup.brands);
      setOrders(backup.orders);
      setCustomers(backup.customers);
      setAccounts(backup.accounts);
      setHiddenPartTypes(Array.isArray(backup.hiddenPartTypes) ? backup.hiddenPartTypes : []);
      const restoredActivityLog = [{
        id: Date.now(),
        type:"backup_restore",
        detail:`Restored backup file ${file.name}`,
        user: currentUser?.name || currentUser?.email || (lang==="th" ? "ระบบ" : "System"),
        date: new Date().toLocaleString(lang==="th" ? "th-TH" : "en-US"),
      }, ...(Array.isArray(backup.activityLog) ? backup.activityLog : [])].slice(0, 200);
      setActivityLog(restoredActivityLog);
      const restoredAnalytics = Array.isArray(backup.analytics) ? backup.analytics : [];
      setAnalytics(restoredAnalytics);
      const restoredSyncEvents = Array.isArray(backup.syncEvents) ? backup.syncEvents : [];
      setSyncEvents(restoredSyncEvents);
      queueImmediateOnlineSave("backup_restored", {
        brands: backup.brands,
        orders: backup.orders,
        customers: backup.customers,
        accounts: backup.accounts,
        hiddenPartTypes: Array.isArray(backup.hiddenPartTypes) ? backup.hiddenPartTypes : [],
        activityLog: restoredActivityLog,
        analytics: restoredAnalytics,
        syncEvents: restoredSyncEvents,
      });
      try { localStorage.setItem("skkj_v2_analytics_v1", JSON.stringify(restoredAnalytics)); } catch (error) {}
      try { localStorage.setItem("skkj_v2_sync_events_v1", JSON.stringify(restoredSyncEvents)); } catch (error) {}
      setBasket([]);
      setEditOrder(null);
      setNewOrderModal(false);
      alert(lang==="th" ? "กู้คืนข้อมูลเรียบร้อยแล้ว" : "Backup restored.");
    } catch (error) {
      alert(lang==="th" ? "ไฟล์สำรองไม่ถูกต้อง" : "This backup file is not valid.");
    }
  }

                  <button type="submit" style={{ flex:2, padding:12, background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontSize:14, fontWeight:600, fontFamily:thF }}>{t.order.confirm}</button>
                </div>
              </form>
            )}
          </SmoothSizeCard>
        </div>
      )}

      {/* ── EDIT ORDER MODAL ── */}
      {editOrder&&(
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>

            <h3 style={{ margin:"0 0 20px", fontSize:18, fontWeight:700 }}>{ta.editTitle} {editOrder.id}</h3>
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {ta.orderFields.map(([k,l])=>(
                <div key={k}><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{l}</label>

              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{lang==="th" ? "\u0e17\u0e35\u0e48\u0e2d\u0e22\u0e39\u0e48\u0e08\u0e31\u0e14\u0e2a\u0e48\u0e07" : "Delivery Address"}</label>
                <textarea value={editOrder.address??""} onChange={e=>setEditOrder({...editOrder,address:e.target.value})} rows={3} style={{ ...iSLight, resize:"vertical" }} /></div>
              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{lang==="th" ? "หมายเหตุจากลูกค้า" : "Customer Note"}</label>
                <textarea value={editOrder.customerNote??""} onChange={e=>setEditOrder({...editOrder,customerNote:e.target.value})} rows={3} placeholder={lang==="th" ? "สิ่งที่ลูกค้าแจ้งไว้" : "What the customer wrote"} style={{ ...iSLight, resize:"vertical" }} /></div>
              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{lang==="th" ? "หมายเหตุแอดมิน (ลูกค้าไม่เห็น)" : "Admin Note (private)"}</label>
                <textarea value={editOrder.adminNote??""} onChange={e=>setEditOrder({...editOrder,adminNote:e.target.value})} rows={3} placeholder={lang==="th" ? "เช่น โทรแล้ว / รอสลิป / เช็กสินค้าแล้ว" : "Example: called customer / waiting for slip / checked stock"} style={{ ...iSLight, resize:"vertical", background:"#FFFDF5", borderColor:"#E8D9A8" }} /></div>
              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{lang==="th"?"วิธีจัดส่ง":"Delivery Method"}</label>
                <select value={editOrder.deliveryMethod || "standard"} onChange={e=>setEditOrder({...editOrder,deliveryMethod:e.target.value})} style={{ ...iSLight, cursor:"pointer" }}>
                  <option value="standard">{lang==="th"?"จัดส่งปกติ":"Standard delivery"}</option>
                  <option value="express_bkk">{lang==="th"?"ส่งด่วน กรุงเทพฯ และปริมณฑล":"Express Bangkok & nearby"}</option>
                </select></div>
              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{lang==="th" ? "\u0e1a\u0e23\u0e34\u0e29\u0e31\u0e17\u0e02\u0e19\u0e2a\u0e48\u0e07" : "Shipping Company"}</label>
                <input value={editOrder.shippingCompany??""} onChange={e=>setEditOrder({...editOrder,shippingCompany:e.target.value})} placeholder={lang==="th" ? "เช่น Kerry, Flash, Thailand Post" : "e.g. Kerry, Flash, Thailand Post"} style={iSLight} /></div>
              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{lang==="th" ? "\u0e40\u0e25\u0e02\u0e1e\u0e31\u0e2a\u0e14\u0e38" : "Tracking Number"}</label>
                <input value={editOrder.trackingNumber??""} onChange={e=>setEditOrder({...editOrder,trackingNumber:e.target.value})} placeholder={lang==="th" ? "กรอกเลขพัสดุ" : "Enter tracking number"} style={iSLight} /></div>
              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>Status</label>
                <select value={editOrder.status} onChange={e=>setEditOrder({...editOrder,status:e.target.value})} style={{ ...iSLight, cursor:"pointer" }}>

              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{lang==="th"?"ตรวจการชำระเงิน":"Payment Check"}</label>
                <select value={editOrder.paymentStatus || "waiting_review"} onChange={e=>setEditOrder({...editOrder,paymentStatus:e.target.value})} style={{ ...iSLight, cursor:"pointer" }}>
                  {Object.keys(PAYMENT_STATUS).map(s=><option key={s} value={s}>{ta.paymentLabels[s]}</option>)}
                </select></div>
              <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:4 }}>{lang==="th"?"ธงแอดมิน":"Admin Flag"}</label>
                <select value={editOrder.adminFlag || "none"} onChange={e=>setEditOrder({...editOrder,adminFlag:e.target.value})} style={{ ...iSLight, cursor:"pointer" }}>

                </select></div>
              <div style={{ display:"flex", gap:10, marginTop:8 }}>
                <button onClick={()=>setEditOrder(null)} style={{ flex:1, padding:12, border:"1px solid #ddd", borderRadius:10, background:"#fff", cursor:"pointer", fontFamily:thF }}>{ta.cancel}</button>
                <button onClick={saveEditOrder} style={{ flex:2, padding:12, background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:600, fontFamily:thF }}>{ta.save}</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── ORDER DETAIL MODAL ── */}
      {detailOrder&&(()=>{
        const sc = ORDER_STATUS[detailOrder.status] || ORDER_STATUS.pending;
        const pc = PAYMENT_STATUS[detailOrder.paymentStatus || "waiting_review"] || PAYMENT_STATUS.waiting_review;
        const fc = orderFlagMeta(detailOrder.adminFlag);
        const shippingRecord = getShippingRecord(detailOrder);
        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:210, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
            <div className="skkj-modal-card" style={{ background:"#fff", borderRadius:16, padding:28, width:"100%", maxWidth:720, maxHeight:"90vh", overflowY:"auto" }}>
              <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, marginBottom:18 }}>
                <div>
                  <h3 style={{ margin:"0 0 4px", fontSize:20, fontWeight:800 }}>{lang==="th"?"รายละเอียดออเดอร์":"Order Details"} {detailOrder.id}</h3>
                  <div style={{ fontSize:12, color:"#777" }}>{detailOrder.date || "-"}</div>
                </div>
                <button onClick={()=>setDetailOrder(null)} style={{ width:34, height:34, borderRadius:17, border:"1px solid #E0DDD8", background:"#fff", cursor:"pointer", fontSize:18, lineHeight:1 }}>×</button>
              </div>

              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:12, marginBottom:16 }}>

                  <div style={{ fontWeight:800, fontSize:15, marginBottom:4 }}>{detailOrder.customer || "-"}</div>
                  <div style={{ fontSize:13, color:"#555", lineHeight:1.55 }}>{detailOrder.phone || "-"}{detailOrder.customerEmail ? <><br/>{detailOrder.customerEmail}</> : null}</div>
                  <div style={{ marginTop:8, fontSize:13, color:"#333", lineHeight:1.55, whiteSpace:"pre-wrap" }}>{detailOrder.address || (lang==="th"?"ยังไม่มีที่อยู่":"No address yet")}</div>
                </div>
                <div style={{ border:"1px solid #ECECEC", borderRadius:12, padding:14, background:"#fff" }}>
                  <div style={{ fontSize:11, color:"#777", fontWeight:800, marginBottom:8 }}>{lang==="th"?"สินค้า":"Product"}</div>
                  <div style={{ fontWeight:800, fontSize:15, marginBottom:4 }}>{detailOrder.brand || "-"} {detailOrder.model || ""}</div>
                  <div style={{ fontSize:13, color:"#555", lineHeight:1.55 }}>{lang==="th"?"จำนวน":"Qty"}: {detailOrder.quantity || 1}<br/>{lang==="th"?"ปีรถ":"Car year"}: {detailOrder.year || "-"}<br/>{lang==="th"?"ราคา":"Price"}: {fmt(detailOrder.price || 0)}</div>
                </div>
              </div>

              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:12, marginBottom:16 }}>
                <div style={{ border:"1px solid #ECECEC", borderRadius:12, padding:14 }}>
                  <div style={{ fontSize:11, color:"#777", fontWeight:800, marginBottom:8 }}>{lang==="th"?"สถานะออเดอร์":"Order Status"}</div>
                  <span style={{ display:"inline-block", background:sc.bg, color:sc.text, borderRadius:20, padding:"4px 10px", fontSize:12, fontWeight:800, marginBottom:10 }}>{ta.statusLabels[detailOrder.status] || detailOrder.status}</span>
                  <select value={detailOrder.status || "pending"} onChange={e=>updateOrderStatus(detailOrder,e.target.value)} style={{ ...iSLight, cursor:"pointer" }}>
                    {Object.keys(ORDER_STATUS).map(s=><option key={s} value={s}>{ta.statusLabels[s]}</option>)}
                  </select>
                </div>
                <div style={{ border:"1px solid #ECECEC", borderRadius:12, padding:14 }}>
                  <div style={{ fontSize:11, color:"#777", fontWeight:800, marginBottom:8 }}>{lang==="th"?"ตรวจการชำระเงิน":"Payment Check"}</div>
                  <div style={{ fontSize:12, color:detailOrder.deliveryMethod==="express_bkk"?"#9A0018":"#555", fontWeight:900, marginBottom:8 }}>{lang==="th"?"วิธีจัดส่ง":"Delivery method"}: {deliveryMethodLabel(detailOrder.deliveryMethod)}</div>
                  <div style={{ fontSize:12, color:"#555", fontWeight:800, marginBottom:8 }}>{lang==="th"?"วิธีจ่ายเงิน":"Payment method"}: {paymentMethodLabel(detailOrder.paymentMethod)}</div>
                  <span style={{ display:"inline-block", background:pc.bg, color:pc.text, borderRadius:20, padding:"4px 10px", fontSize:12, fontWeight:800, marginBottom:10 }}>{ta.paymentLabels[detailOrder.paymentStatus || "waiting_review"]}</span>
                  <select value={detailOrder.paymentStatus || "waiting_review"} onChange={e=>updatePaymentStatus(detailOrder,e.target.value)} style={{ ...iSLight, cursor:"pointer" }}>
                    {Object.keys(PAYMENT_STATUS).map(s=><option key={s} value={s}>{ta.paymentLabels[s]}</option>)}
                  </select>
                  {detailOrder.paymentSlip ? (
                    <button onClick={()=>openPaymentSlip(detailOrder)} style={{ marginTop:10, background:"#DCFCE7", border:"1px solid #BBF7D0", color:"#166534", borderRadius:9, padding:"8px 12px", cursor:"pointer", fontSize:12, fontWeight:800, fontFamily:thF }}>{lang==="th"?"เปิดสลิป":"Open Slip"}</button>
                  ) : (
                    <div style={{ marginTop:10, fontSize:12, color:"#999" }}>{lang==="th"?"ยังไม่มีสลิปแนบ":"No slip uploaded yet"}</div>
                  )}
                </div>
                <div style={{ border:"1px solid #ECECEC", borderRadius:12, padding:14 }}>
                  <div style={{ fontSize:11, color:"#777", fontWeight:800, marginBottom:8 }}>{lang==="th"?"ธงแอดมิน":"Admin Flag"}</div>
                  <span style={{ display:"inline-block", background:fc.bg, color:fc.text, borderRadius:20, padding:"4px 10px", fontSize:12, fontWeight:800, marginBottom:10 }}>{orderFlagLabel(detailOrder.adminFlag)}</span>
                  <select value={detailOrder.adminFlag || "none"} onChange={e=>updateOrderFlag(detailOrder,e.target.value)} style={{ ...iSLight, cursor:"pointer" }}>
                    {Object.keys(ORDER_FLAGS).map(s=><option key={s} value={s}>{orderFlagLabel(s)}</option>)}
                  </select>
                </div>
              </div>

              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:12, marginBottom:16, fontSize:13, color:"#555", lineHeight:1.55 }}>
                <div style={{ border:"1px solid #ECECEC", borderRadius:12, padding:14, background:"#FAFAF8" }}><strong style={{ color:"#333" }}>{lang==="th"?"หมายเหตุลูกค้า":"Customer note"}:</strong><br/>{detailOrder.customerNote || "-"}</div>
                <div style={{ border:"1px solid #ECECEC", borderRadius:12, padding:14, background:"#FFFDF5" }}><strong style={{ color:"#333" }}>{lang==="th"?"หมายเหตุแอดมิน":"Admin note"}:</strong><br/>{detailOrder.adminNote || "-"}</div>

                    {detailOrder.trackingNumber && (
                      <button onClick={()=>copyTrackingNumber(detailOrder.trackingNumber)} style={{ background:"#F0EEE8", border:"1px solid #E0DDD8", color:"#1A1A1A", borderRadius:8, padding:"6px 9px", cursor:"pointer", fontSize:11, fontWeight:900, fontFamily:thF }}>
                        {lang==="th"?"คัดลอกเลข":"Copy"}
                      </button>
                    )}

                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:8 }}>

                    </div>
                    <div>
                      <label style={{ display:"block", color:"#777", fontSize:11, fontWeight:800, marginBottom:4 }}>{lang==="th"?"เลขพัสดุ":"Tracking number"}</label>
                      <input value={detailOrder.trackingNumber || ""} onChange={e=>setDetailOrder(prev=>prev?{...prev,trackingNumber:e.target.value}:prev)} placeholder={lang==="th"?"กรอกเลขพัสดุ":"Enter tracking number"} style={{ ...iSLight, padding:"9px 10px", fontSize:13, fontFamily:"monospace" }} />
                    </div>
                  </div>
                  <button onClick={()=>saveOrderTracking(detailOrder)} style={{ marginTop:10, width:"100%", background:"#1A1A1A", color:"#fff", border:"1px solid #1A1A1A", borderRadius:9, padding:"10px 12px", cursor:"pointer", fontSize:13, fontWeight:900, fontFamily:thF }}>
                    {lang==="th"?"บันทึกเลขพัสดุ และเปลี่ยนเป็นกำลังจัดส่ง":"Save tracking and mark as shipping"}
                  </button>
                </div>
              </div>

              <div style={{ border:"1px solid #E0DDD8", borderRadius:14, padding:14, background:"#FAFAF8", marginBottom:16 }}>
                <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap", marginBottom:12 }}>
                  <div>
                    <div style={{ fontSize:14, fontWeight:900, color:"#1A1A1A" }}>{lang==="th"?"ประวัติข้อมูลจัดส่งที่บันทึกไว้":"Saved Delivery Record"}</div>
                    <div style={{ fontSize:11, color:"#777", marginTop:2 }}>{lang==="th"?"ส่วนนี้ไม่พิมพ์ลงป้าย A6 แต่บันทึกไว้กับออเดอร์ใน Supabase สำหรับแอดมินตรวจย้อนหลัง":"This is not printed on the A6 label. It is saved with the order for admin history."}</div>
                  </div>
                  <span style={{ background:"#fff", border:"1px solid #E0DDD8", color:"#777", borderRadius:999, padding:"4px 9px", fontSize:11, fontWeight:800 }}>{shippingRecord.id}</span>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))", gap:10, marginBottom:12 }}>
                  <div style={{ background:"#fff", border:"1px solid #ECECEC", borderRadius:11, padding:12 }}>
                    <div style={{ fontSize:10, color:"#888", fontWeight:900, marginBottom:6 }}>{lang==="th"?"ผู้ส่ง":"Sender"}</div>
                    <div style={{ fontSize:13, color:"#1A1A1A", fontWeight:900 }}>{shippingRecord.sender?.name || "SKKJ Autopart"}</div>
                    <div style={{ marginTop:5, fontSize:12, color:"#555", lineHeight:1.5 }}>{shippingRecord.sender?.address || "-"}</div>
                  </div>
                  <div style={{ background:"#fff", border:"1px solid #ECECEC", borderRadius:11, padding:12 }}>
                    <div style={{ fontSize:10, color:"#888", fontWeight:900, marginBottom:6 }}>{lang==="th"?"ผู้รับ":"Receiver"}</div>
                    <div style={{ fontSize:13, color:"#1A1A1A", fontWeight:900 }}>{shippingRecord.receiver?.name || "-"}</div>
                    <div style={{ marginTop:5, fontSize:12, color:"#555", lineHeight:1.5 }}>{shippingRecord.receiver?.phone || "-"}<br/>{shippingRecord.receiver?.address || "-"}</div>
                  </div>
                  <div style={{ background:"#fff", border:"1px solid #ECECEC", borderRadius:11, padding:12 }}>
                    <div style={{ fontSize:10, color:"#888", fontWeight:900, marginBottom:6 }}>{lang==="th"?"ขนส่ง / ชำระเงิน":"Delivery / Payment"}</div>
                    <div style={{ fontSize:12, color:"#555", lineHeight:1.65 }}>
                      {lang==="th"?"จัดส่ง":"Delivery"}: <strong style={{ color:"#1A1A1A" }}>{shippingRecord.delivery?.methodLabel || "-"}</strong><br/>
                      {lang==="th"?"บริษัท":"Company"}: {shippingRecord.delivery?.company || "-"}<br/>
                      {lang==="th"?"เลขพัสดุ":"Tracking"}: {shippingRecord.delivery?.trackingNumber || "-"}<br/>
                      {lang==="th"?"จ่ายเงิน":"Payment"}: {shippingRecord.payment?.methodLabel || "-"} / {shippingRecord.payment?.statusLabel || "-"}<br/>
                      {lang==="th"?"ยอดรวม":"Total"}: <strong style={{ color:"#9A0018" }}>{fmt(shippingRecord.payment?.total || 0)}</strong>
                    </div>
                  </div>
                  <div style={{ background:"#fff", border:"1px solid #ECECEC", borderRadius:11, padding:12 }}>
                    <div style={{ fontSize:10, color:"#888", fontWeight:900, marginBottom:6 }}>{lang==="th"?"ข้อมูลป้าย":"Label Info"}</div>
                    <div style={{ fontSize:12, color:"#555", lineHeight:1.65 }}>
                      {lang==="th"?"พิมพ์แล้ว":"Printed"}: <strong style={{ color:shippingRecord.delivery?.labelPrinted?"#166534":"#777" }}>{shippingRecord.delivery?.labelPrinted ? (lang==="th"?"ใช่":"Yes") : (lang==="th"?"ยัง":"No")}</strong><br/>
                      {lang==="th"?"จำนวนครั้ง":"Print count"}: {shippingRecord.printedCount || 0}<br/>
                      {lang==="th"?"พิมพ์ล่าสุด":"Last printed"}: {shippingRecord.printedAt ? new Date(shippingRecord.printedAt).toLocaleString(lang==="th"?"th-TH":"en-US") : "-"}<br/>
                      {lang==="th"?"ยอดปลายทาง":"COD amount"}: {fmt(shippingRecord.payment?.codAmount || 0)}
                    </div>
                  </div>
                </div>
                <div style={{ background:"#fff", border:"1px solid #ECECEC", borderRadius:11, overflow:"hidden" }}>
                  <div style={{ display:"grid", gridTemplateColumns:"minmax(160px,1fr) 70px 92px", gap:8, padding:"9px 11px", background:"#FAFAF8", color:"#777", fontSize:11, fontWeight:900 }}>
                    <div>{lang==="th"?"สินค้า":"Item"}</div>
                    <div>{lang==="th"?"จำนวน":"Qty"}</div>
                    <div>{lang==="th"?"ราคา":"Total"}</div>
                  </div>
                  {(shippingRecord.items || []).map((item, index)=>(
                    <div key={index} style={{ display:"grid", gridTemplateColumns:"minmax(160px,1fr) 70px 92px", gap:8, padding:"10px 11px", borderTop:index===0?"none":"1px solid #F0EEE8", fontSize:12, color:"#333" }}>
                      <div><strong>{item.brand} {item.model}</strong><br/><span style={{ color:"#888", fontSize:11 }}>{item.year || "-"} · {item.sku || "-"}</span></div>
                      <div style={{ fontFamily:"monospace", fontWeight:900 }}>{item.quantity || 1}</div>
                      <div style={{ fontFamily:"monospace", fontWeight:900 }}>{fmt(item.total || 0)}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ border:"1px solid #E0DDD8", borderRadius:14, padding:14, background:"#FAFAF8", marginBottom:16 }}>
                <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap", marginBottom:12 }}>
                  <div>
                    <div style={{ fontSize:14, fontWeight:900, color:"#1A1A1A" }}>{lang==="th"?"ประวัติออเดอร์ภายใน":"Private order timeline"}</div>
                    <div style={{ fontSize:11, color:"#777", marginTop:2 }}>{lang==="th"?"ลูกค้าไม่เห็นส่วนนี้ ใช้สำหรับแอดมินเท่านั้น":"Customer cannot see this. Admin only."}</div>
                  </div>
                  <span style={{ background:"#fff", border:"1px solid #E0DDD8", color:"#777", borderRadius:999, padding:"4px 9px", fontSize:11, fontWeight:800 }}>{orderTimeline(detailOrder).length} {lang==="th"?"รายการ":"events"}</span>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"minmax(0,1fr) auto", gap:8, marginBottom:12 }}>

                <div style={{ background:"#FFFDF5", border:"1px solid #E8D9A8", borderRadius:14, padding:"14px 16px", color:"#5F4819", fontSize:13, lineHeight:1.7 }}>
                  {lang==="th"?"กรุณาตรวจสอบรุ่นรถและปีรถก่อนสั่งซื้อ หากไม่แน่ใจสามารถกดถามร้านได้ทันที":"Please check the car model and year before ordering. If unsure, ask the shop first."}

                  </button>
                  <button className="v2-ask-button" onClick={()=>askAboutProduct(detailBrand, detailModel)} style={{ background:"#fff", color:"#1A1A1A", border:"1px solid #E0DDD8", borderRadius:12, padding:"13px 14px", cursor:"pointer", fontSize:14, fontWeight:900, fontFamily:thF }}>
                    {lang==="th"?"ถามร้าน":"Ask shop"}
                  </button>
                  <a className="v2-ask-button" href={productNewTabUrl(detailBrand.id, detailModel.id)} target="_blank" rel="noopener noreferrer" style={{ background:"#fff", color:"#1A1A1A", border:"1px solid #E0DDD8", borderRadius:12, padding:"13px 14px", cursor:"pointer", fontSize:14, fontWeight:900, fontFamily:thF, textAlign:"center", textDecoration:"none" }}>
                    {lang==="th"?"เปิดแท็บใหม่":"Open new tab"}
                  </a>
                  <button className="v2-ask-button" onClick={()=>saveCustomerCar(detailBrand, detailModel)} style={{ background:"#FFF7ED", color:"#9A0018", border:"1px solid #F3D7B5", borderRadius:12, padding:"13px 14px", cursor:"pointer", fontSize:14, fontWeight:900, fontFamily:thF }}>
                    {lang==="th"?"บันทึกรถคันนี้":"Save this car"}
                  </button>
                </div>
              </div>
            </div>

            {/* ══ RELATED PRODUCTS (same brand) ══ */}
            {(() => {
              const related = (detailBrand.models || [])
                .filter(m => m.id !== detailModel.id && isProductVisible(m) && isPartTypeVisible(getModelPartType(m)))

              return (
                <div style={{ marginTop:18, background:"#fff", borderRadius:16, border:"1px solid #ECECEC", padding:"22px 24px" }}>
                  <h3 style={{ margin:"0 0 4px", fontSize:18, fontWeight:900 }}>{lang==="th"?`สินค้า ${detailBrand.nameTh} รุ่นอื่น`:`More from ${detailBrand.nameEn}`}</h3>
                  <p style={{ margin:"0 0 16px", color:"#777", fontSize:13 }}>{lang==="th"?"แร็คพวงมาลัยรุ่นอื่นในยี่ห้อเดียวกัน":"Other steering racks from the same brand"}</p>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))", gap:12 }}>
                    {related.map(m => (
                      <div key={m.id} onClick={()=>openProductDetail(detailBrand, m)} role="button" tabIndex={0} onKeyDown={e=>{ if(e.key==="Enter"){ openProductDetail(detailBrand, m); } }} style={{ border:"1px solid #ECECEC", borderRadius:12, overflow:"hidden", cursor:"pointer", background:"#fff", transition:"box-shadow .15s" }} onMouseEnter={e=>e.currentTarget.style.boxShadow="0 8px 20px rgba(0,0,0,0.08)"} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
                        <div style={{ height:90, background:"#F8F7F4", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden" }}>
                          <ProductPhotoBox brand={detailBrand} model={m} lang={lang} t={t} height={90} onMagnify={()=>{}} onOpenDetail={()=>openProductDetail(detailBrand, m)} />
                        </div>
                        <div style={{ padding:"8px 10px 10px" }}>
                          <div style={{ fontSize:12, fontWeight:900, color:"#1A1A1A", lineHeight:1.3, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{lang==="th"?m.nameTh:m.nameEn}</div>
                          <div style={{ fontSize:12, fontWeight:900, color:"#9A0018", marginTop:3 }}>{fmt(m.price)}</div>
                          <div style={{ fontSize:10.5, color:m.stock===0?"#E24B4A":"#888", marginTop:2 }}>{m.stock===0?t.outOfStock:`${m.stock} ${t.inStock}`}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}
          </div>
        )}

        {/* ══ POLICY / FAQ ══ */}
        {page==="policy"&&(
          <div style={{ padding:"56px 0", maxWidth:860, margin:"0 auto" }}>
            <h2 style={{ fontSize:32, fontWeight:800, letterSpacing:"-1px", margin:"0 0 8px" }}>{t.policy.h2}</h2>
            <p style={{ color:"#666", fontSize:15, margin:"0 0 28px", lineHeight:1.7 }}>{t.policy.sub}</p>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))", gap:14 }}>
              {t.policy.items.map(item=>(
                <div key={item.title} style={{ background:"#fff", border:"1px solid #ECECEC", borderRadius:14, padding:"18px 18px 20px" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
                    <span style={{ width:32, height:32, borderRadius:10, background:"#F0EEE8", border:"1px solid #E0DDD8", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, color:"#1A1A1A", flexShrink:0 }}>{item.icon}</span>
                    <h3 style={{ margin:0, fontSize:15, fontWeight:800 }}>{item.title}</h3>
                  </div>
                  <p style={{ margin:0, color:"#555", fontSize:13, lineHeight:1.8 }}>{item.body}</p>
                </div>
              ))}
            </div>
            <div style={{ marginTop:16, background:"#FAFAF8", border:"1px solid #ECECEC", borderRadius:14, padding:"16px 18px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:14, flexWrap:"wrap" }}>
              <div>
                <div style={{ fontSize:14, fontWeight:800, marginBottom:4 }}>{t.policy.noteTitle}</div>
                <div style={{ fontSize:13, color:"#666", lineHeight:1.6 }}>{t.policy.note}</div>
              </div>
              <button onClick={()=>setPage("contact")} style={{ background:"#1A1A1A", color:"#fff", border:"none", borderRadius:12, padding:"11px 18px", cursor:"pointer", fontSize:13, fontWeight:700, fontFamily:thF }}>
                {t.nav.contact}
              </button>
            </div>
          </div>
        )}

        {/* ══ CONTACT ══ */}
        {page==="contact"&&(
          <div style={{ padding:"60px 0", maxWidth:700, margin:"0 auto" }}>

            <p style={{ color:"#666", fontSize:15, marginBottom:34, lineHeight:1.7 }}>{t.contact.sub}</p>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))", gap:24 }}>
              <div>
                {contactSent ? (
                  <div style={{ background:"#D4EDDA", border:"1px solid #C3E6CB", borderRadius:14, padding:32, textAlign:"center" }}>
                    <div style={{ fontSize:40, marginBottom:12 }}>✓</div>
                    <h3 style={{ margin:"0 0 8px", color:"#155724", fontWeight:700 }}>{t.contact.sent}</h3>
                    <p style={{ margin:0, color:"#155724", fontSize:14 }}>{t.contact.sentSub}</p>
                    <button onClick={()=>{ setContactSent(false); setContactBrandId(""); setContactModelId(""); setContactMessage(""); }} style={{ marginTop:16, background:"#155724", color:"#fff", border:"none", borderRadius:10, padding:"10px 20px", cursor:"pointer", fontSize:13, fontFamily:thF }}>{t.contact.sendAnother}</button>
                  </div>
                ) : (
                  <form onSubmit={e=>{e.preventDefault();setContactSent(true);}} style={{ display:"flex", flexDirection:"column", gap:14 }}>
                    {[["name","namePh"],["phone","phonePh"],["email","emailPh"]].map(([k,ph])=>(
                      <div key={k}><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:6 }}>{t.contact[k]}</label>

                    ))}
                    <div style={{ background:"#FAFAF8", border:"1px solid #ECECEC", borderRadius:12, padding:12 }}>
                      <label style={{ fontSize:12, color:"#555", display:"block", marginBottom:8, fontWeight:800 }}>{lang==="th"?"เลือกรถ/สินค้า (ไม่ต้องพิมพ์)":"Choose car/product (no typing)"}</label>

                          <option value="">{lang==="th"?"เลือกยี่ห้อรถ":"Choose brand"}</option>

                        </select>
                        <select value={contactModelId} disabled={!contactBrandId} onChange={e=>{ setContactModelId(e.target.value); applyContactProduct(contactBrandId, e.target.value); }} style={{ ...iSLight, background:contactBrandId?"#fff":"#F0EEE8", cursor:contactBrandId?"pointer":"not-allowed" }}>
                          <option value="">{lang==="th"?"เลือกรุ่นสินค้า":"Choose model"}</option>
                          {contactModels.map(m=><option key={m.id} value={m.id}>{lang==="th"?m.nameTh:m.nameEn}{m.years?` (${m.years})`:""}</option>)}
                        </select>
                      </div>
                      <div style={{ fontSize:11, color:"#888", marginTop:8 }}>{lang==="th"?"เมื่อเลือกรุ่นแล้ว ระบบจะเติมชื่อสินค้าในข้อความให้เอง":"After choosing a model, the website fills the product name into the message."}</div>

                    <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:6 }}>{t.contact.message}</label>

                  </form>

                  <div key={c.title} style={{ background:"#fff", borderRadius:12, padding:"14px 16px", border:"1px solid #ECECEC", display:"flex", gap:12, alignItems:"flex-start" }}>
                    <span style={{ fontSize:18 }}>{c.icon}</span>
                    <div><div style={{ fontWeight:700, fontSize:12, marginBottom:3 }}>{c.title}</div>
                      <div style={{ color:"#666", fontSize:13, whiteSpace:"pre-line", lineHeight:1.6 }}>{c.val}</div></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {page==="profile" && currentCustomer && (
          <div style={{ padding:"60px 0", maxWidth:700, margin:"0 auto" }}>
            {/* Header */}
            <div style={{ display:"flex", alignItems:"center", gap:18, marginBottom:36, flexWrap:"wrap" }}>
              <div style={{ width:64, height:64, background:"linear-gradient(135deg,#1A1A1A,#444)", borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", fontSize:26, fontWeight:800, color:"#fff", flexShrink:0 }}>
                {currentCustomer.name.charAt(0).toUpperCase()}
              </div>
              <div>
                <h2 style={{ margin:"0 0 4px", fontSize:22, fontWeight:800 }}>{t.auth.greeting} {currentCustomer.name}</h2>
                <p style={{ margin:0, color:"#888", fontSize:13 }}>{currentCustomer.email || currentCustomer.phone || "-"} · {t.auth.customersSince} {currentCustomer.joinDate}</p>
              </div>
              <button onClick={handleLogout} style={{ marginLeft:"auto", background:"#F0EEE8", border:"1px solid #E0DDD8", borderRadius:10, padding:"9px 16px", cursor:"pointer", fontSize:13, fontWeight:600, fontFamily:thF, color:"#555" }}>
                {t.nav.logout}
              </button>
            </div>

            {/* Profile info */}
            <div style={{ background:"#fff", borderRadius:16, border:"1px solid #ECECEC", padding:"24px", marginBottom:24 }}>

              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))", gap:14 }}>
                {[
                  [t.auth.name, currentCustomer.name],
                  [t.auth.email, currentCustomer.email],
                  [t.auth.phone, currentCustomer.phone || "—"],
                  [t.auth.customersSince, currentCustomer.joinDate],
                ].map(([label,val])=>(
                  <div key={label} style={{ background:"#F8F7F4", borderRadius:10, padding:"12px 14px" }}>
                    <div style={{ fontSize:11, color:"#999", marginBottom:4, textTransform:"uppercase", letterSpacing:0.5 }}>{label}</div>
                    <div style={{ fontSize:14, fontWeight:600 }}>{val}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ background:"#fff", borderRadius:16, border:"1px solid #ECECEC", padding:"24px", marginBottom:24 }}>
              <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap", marginBottom:16 }}>
                <div>
                  <h3 style={{ margin:"0 0 5px", fontSize:16, fontWeight:800 }}>{lang==="th"?"ที่อยู่ที่บันทึกไว้":"Saved addresses"}</h3>
                  <p style={{ margin:0, color:"#777", fontSize:13, lineHeight:1.5 }}>{lang==="th"?"ระบบจะบันทึกที่อยู่จากคำสั่งซื้อของคุณสูงสุด 5 ช่อง":"Your latest order addresses are saved here, up to 5 slots."}</p>
                </div>
              </div>
              {(currentCustomer.addresses || []).length === 0 ? (
                <div style={{ background:"#F8F7F4", border:"1px solid #F0EEE8", borderRadius:12, padding:"18px", color:"#999", fontSize:13 }}>
                  {lang==="th"?"ยังไม่มีที่อยู่ที่บันทึกไว้ สั่งซื้อครั้งแรกแล้วระบบจะบันทึกให้":"No saved address yet. Your first order will save one automatically."}
                </div>
              ) : (
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:10 }}>
                  {(currentCustomer.addresses || []).map((addr, i) => (
                    <div key={addr.id || i} style={{ background:"#FAFAF8", border:"1px solid #ECECEC", borderRadius:12, padding:"13px 14px" }}>
                      <div style={{ display:"flex", justifyContent:"space-between", gap:8, alignItems:"center", marginBottom:7 }}>
                        <div style={{ fontSize:13, fontWeight:900, color:"#1A1A1A" }}>{addr.label || (lang==="th"?`ที่อยู่ ${i+1}`:`Address ${i+1}`)}</div>

                          {lang==="th"?"ลบ":"Remove"}
                        </button>
                      </div>
                      <div style={{ fontSize:12, color:"#555", lineHeight:1.55, fontWeight:700 }}>{addr.customer || currentCustomer.name}</div>
                      <div style={{ fontSize:12, color:"#555", lineHeight:1.55 }}>{addr.phone || currentCustomer.phone || "-"}</div>
                      <div style={{ fontSize:12, color:"#666", lineHeight:1.55, marginTop:4, whiteSpace:"pre-wrap" }}>{addr.address}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ background:"#fff", borderRadius:16, border:"1px solid #ECECEC", padding:"24px", marginBottom:24 }}>
              <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap", marginBottom:16 }}>
                <div>
                  <h3 style={{ margin:"0 0 5px", fontSize:16, fontWeight:900 }}>{lang==="th"?"รถที่บันทึกไว้":"Saved cars"}</h3>
                  <p style={{ margin:0, color:"#777", fontSize:13, lineHeight:1.5 }}>{lang==="th"?"กลับมาครั้งหน้าเลือกจากตรงนี้ได้เลย ไม่ต้องจำรุ่นเอง":"Next time, pick from here instead of searching again."}</p>
                </div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))", gap:10, background:"#FAFAF8", border:"1px solid #ECECEC", borderRadius:12, padding:12, marginBottom:14 }}>
                <select value={savedCarBrandId} onChange={e=>{ setSavedCarBrandId(e.target.value); setSavedCarModelId(""); }} style={{ ...iSLight, background:"#fff", cursor:"pointer" }}>
                  <option value="">{lang==="th"?"เลือกยี่ห้อรถ":"Choose brand"}</option>

                </select>
                <select value={savedCarModelId} disabled={!savedCarBrandId} onChange={e=>setSavedCarModelId(e.target.value)} style={{ ...iSLight, background:"#fff", cursor:savedCarBrandId?"pointer":"not-allowed" }}>
                  <option value="">{lang==="th"?"เลือกรุ่นรถ":"Choose model"}</option>
                  {savedCarModels.map(m=><option key={m.id} value={m.id}>{lang==="th"?m.nameTh:m.nameEn}{m.years?` (${m.years})`:""}</option>)}
                </select>
                <button disabled={!savedCarBrand || !savedCarModel} onClick={()=>saveCustomerCar(savedCarBrand, savedCarModel)} style={{ background:(!savedCarBrand || !savedCarModel)?"#E8E6E0":"#1A1A1A", color:(!savedCarBrand || !savedCarModel)?"#999":"#fff", border:"1px solid "+((!savedCarBrand || !savedCarModel)?"#E8E6E0":"#1A1A1A"), borderRadius:10, padding:"11px 13px", cursor:(!savedCarBrand || !savedCarModel)?"not-allowed":"pointer", fontSize:13, fontWeight:900, fontFamily:thF }}>
                  {lang==="th"?"บันทึกรถ":"Save car"}
                </button>
              </div>
              {(currentCustomer.savedCars || []).length === 0 ? (
                <div style={{ background:"#F8F7F4", border:"1px solid #F0EEE8", borderRadius:12, padding:"18px", color:"#999", fontSize:13 }}>
                  {lang==="th"?"ยังไม่มีรถที่บันทึกไว้ ลองใช้ช่องค้นหาอะไหล่แล้วกดบันทึกรถคันนี้":"No saved cars yet. Use Find My Part and save one."}
                </div>
              ) : (
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:10 }}>
                  {(currentCustomer.savedCars || []).map(car => (
                    <div key={car.id} style={{ background:"#FAFAF8", border:"1px solid #ECECEC", borderRadius:12, padding:"13px 14px" }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8, marginBottom:8 }}>
                        <div>
                          <div style={{ fontSize:14, fontWeight:900, color:"#1A1A1A" }}>{lang==="th"?car.brandNameTh:car.brandNameEn} {lang==="th"?car.modelNameTh:car.modelNameEn}</div>
                          <div style={{ fontSize:12, color:"#777", marginTop:2 }}>{car.years || (lang==="th"?"ไม่ระบุปี":"Year not listed")} · {getPartTypeLabel(car.partType, lang)}</div>
                        </div>
                        <button onClick={()=>removeCustomerCar(car.id)} style={{ background:"#fff", border:"1px solid #E0DDD8", color:"#9A0018", borderRadius:8, padding:"4px 8px", cursor:"pointer", fontSize:11, fontWeight:800, fontFamily:thF }}>
                          {lang==="th"?"ลบ":"Remove"}
                        </button>
                      </div>
                      <button onClick={()=>showSavedCarParts(car)} style={{ width:"100%", background:"#1A1A1A", color:"#fff", border:"none", borderRadius:9, padding:"9px 11px", cursor:"pointer", fontSize:12, fontWeight:900, fontFamily:thF }}>
                        {lang==="th"?"ดูอะไหล่ของรถคันนี้":"View parts for this car"}
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={{ background:"#fff", borderRadius:16, border:"1px solid #ECECEC", padding:"24px", marginBottom:24 }}>
              <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap", marginBottom:16 }}>
                <div>
                  <h3 style={{ margin:"0 0 5px", fontSize:16, fontWeight:900 }}>{lang==="th"?"รายการโปรด":"Favorites"}</h3>
                  <p style={{ margin:0, color:"#777", fontSize:13, lineHeight:1.5 }}>{lang==="th"?"สินค้าที่กดหัวใจไว้ จะกลับมาดูหรือสั่งซื้อได้ง่าย":"Hearted products are saved here for easy return."}</p>
                </div>
              </div>
              {favoriteProducts.length === 0 ? (
                <div style={{ background:"#F8F7F4", border:"1px solid #F0EEE8", borderRadius:12, padding:"18px", color:"#999", fontSize:13 }}>
                  {lang==="th"?"ยังไม่มีรายการโปรด กดหัวใจบนสินค้าเพื่อบันทึกไว้":"No favorites yet. Tap the heart on a product to save it."}
                </div>
              ) : (
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:10 }}>
                  {favoriteProducts.map(({ brand, model, key }) => (

                        </button>

            {/* Order history — show orders matching this customer's email/name */}

              <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap", marginBottom:18 }}>
                <div>
                  <h3 style={{ margin:"0 0 5px", fontSize:18, fontWeight:900 }}>{t.auth.myOrders}</h3>
                  <p style={{ margin:0, color:"#777", fontSize:13, lineHeight:1.5 }}>{lang==="th"?"ดูสถานะสินค้า การชำระเงิน การจัดส่ง และเลขพัสดุของคุณ":"Track product status, payment, delivery, and tracking number here."}</p>
                </div>
              </div>
              {(() => {
                const customerEmail = String(currentCustomer.email || "").toLowerCase();
                const customerName = currentCustomer.name.toLowerCase();
                const customerPhone = String(currentCustomer.phone || "").replace(/\D/g, "");
                const myOrders = orders.filter(o => {
                  const orderEmail = String(o.customerEmail || "").toLowerCase();
                  const orderName = String(o.customer || "").toLowerCase();
                  const orderPhone = String(o.phone || "").replace(/\D/g, "");
                  return orderEmail === customerEmail || orderName === customerName || (!!customerPhone && orderPhone === customerPhone);
                });
                const filteredMyOrders = myOrders.filter(o=>orderMatchesFilters(o, customerOrderSearch, customerOrderStatus));
                const paidMyOrders = myOrders.filter(o=>o.status!=="cancelled");

                      const sc = ORDER_STATUS[o.status] || ORDER_STATUS.pending;

                      const trackingReady = !!String(o.trackingNumber || "").trim();

                            </div>
                          </div>

                          <OrderProgressTimeline order={o} lang={lang} statusLabels={t.admin.statusLabels} thF={thF} />

                          <div className="customer-order-meta-grid" style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:9, background:"#fff", border:"1px solid #ECECEC", borderRadius:12, padding:12, marginBottom:10 }}>
                            <div>
                              <div style={{ fontSize:10, color:"#888", fontWeight:800, marginBottom:4 }}>{lang==="th"?"การชำระเงิน":"Payment"}</div>

                            </div>
                            <div>
                              <div style={{ fontSize:10, color:"#888", fontWeight:800, marginBottom:4 }}>{lang==="th"?"ขนส่ง":"Shipping"}</div>

                              </div>
                            </div>
                          </div>
                          <div className="customer-order-address-grid" style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:10, fontSize:12, color:"#666", lineHeight:1.5 }}>
                            <div><strong style={{ color:"#333" }}>{lang==="th"?"เบอร์โทร":"Phone"}:</strong> {o.phone || "-"}</div>
                            <div><strong style={{ color:"#333" }}>{lang==="th"?"ที่อยู่จัดส่ง":"Delivery address"}:</strong> {o.address || "-"}</div>
                            <div><strong style={{ color:"#333" }}>{lang==="th"?"หมายเหตุ":"Note"}:</strong> {o.customerNote || "-"}</div>
                          </div>
                          {o.status==="shipped" && !trackingReady && (
                            <div style={{ marginTop:10, background:"#EFF6FF", color:"#1D4ED8", border:"1px solid #BFDBFE", borderRadius:10, padding:"10px 12px", fontSize:12, fontWeight:800, lineHeight:1.45 }}>
                              {lang==="th"?"สินค้ากำลังจัดส่งแล้ว เลขพัสดุจะถูกเพิ่มเมื่อแอดมินอัปเดต":"Your order is shipping. Tracking number will appear after admin updates it."}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
            </div>
          </div>
        )}

        {/* ══ ADMIN ══ */}
        {page==="admin"&&(
          <div style={{ padding:"60px 0" }}>
            {!adminAuth ? (

              <div style={{ maxWidth:400, margin:"0 auto" }}>
                <div style={{ textAlign:"center", marginBottom:28 }}>
                  <div style={{ width:56, height:56, background:"#1A1A1A", borderRadius:16, display:"flex", alignItems:"center", justifyContent:"center", fontSize:24, margin:"0 auto 14px", boxShadow:"0 8px 24px rgba(0,0,0,0.22)" }}>🔐</div>
                  <h2 style={{ fontSize:22, fontWeight:800, margin:"0 0 6px" }}>{lang==="th"?"เข้าสู่ระบบ":"Login"}</h2>
                  <p style={{ color:"#888", fontSize:13, margin:0 }}>{lang==="th"?"เข้าสู่ระบบเพื่อดำเนินการต่อ":"Sign in to continue"}</p>

                <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

                      onKeyDown={e=>e.key==="Enter"&&adminLogin(e)}

                  </div>
                  <div>
                    <label style={{ fontSize:12, color:"#666", display:"block", marginBottom:6 }}>{lang==="th"?"รหัสผ่าน":"Password"}</label>
                    <input type="password" value={adminPw} onChange={e=>setAdminPw(e.target.value)}
                      onKeyDown={e=>e.key==="Enter"&&adminLogin(e)}
                      placeholder="••••••••"
                      style={{ ...iSLight, letterSpacing:3 }} autoComplete="current-password" />
                  </div>
                  <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:12, color:"#555", fontWeight:700, cursor:"pointer", userSelect:"none" }}>
                    <input type="checkbox" checked={authRemember} onChange={e=>setAuthRemember(e.target.checked)} style={{ width:16, height:16, accentColor:"#1A1A1A" }} />
                    {lang==="th" ? "จดจำการเข้าสู่ระบบครั้งนี้" : "Remember me on this device"}
                  </label>
                  {adminError && (
                    <div style={{ background:"#FFF5F5", border:"1px solid #FECACA", borderRadius:9, padding:"10px 14px", fontSize:13, color:"#dc2626", display:"flex", alignItems:"center", gap:8 }}>
                      <span>⚠</span>{adminError}
                    </div>
                  )}
                  <button type="button" onClick={adminLogin}
                    style={{ background:"linear-gradient(135deg,#1A1A1A,#333)", color:"#fff", border:"none", borderRadius:12, padding:14, fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:thF, marginTop:4 }}>
                    {lang==="th"?"เข้าสู่ระบบ →":"Login →"}
                  </button>
                </div>
              </div>
            ) : (
              /* ── DASHBOARD ── */
              <div className="admin-dashboard-card" style={{ background:"#fff", borderRadius:20, padding:22, minHeight:600, border:"1px solid #ECECEC" }}>
                {/* Header */}
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:22, flexWrap:"wrap", gap:12 }}>
                  <div>
                    <h2 style={{ fontSize:21, fontWeight:800, margin:0, color:"#1A1A1A", letterSpacing:"-0.5px" }}>{ta.dashboard}</h2>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:4 }}>
                      <span style={{ background:"#F0EEE8", color:"#1A1A1A", borderRadius:20, padding:"2px 10px", fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:0.5 }}>
                        {currentUser?.role==="owner" ? (lang==="th"?"เจ้าของ":"Owner") : (lang==="th"?"แอดมิน":"Admin")}
                      </span>
                      <span style={{ color:"#666", fontSize:12 }}>{currentUser?.name}</span>
                      <span style={{ color:"#999", fontSize:11 }}>·</span>
                      <span style={{ color:"#999", fontSize:11 }}>{currentUser?.email}</span>

                  <div style={{ display:"flex", gap:10 }}>
                    <button onClick={()=>setNewOrderModal(true)} style={{ background:"#1A1A1A", color:"#fff", border:"1px solid #1A1A1A", borderRadius:10, padding:"9px 16px", cursor:"pointer", fontSize:13, fontWeight:600, fontFamily:thF, boxShadow:"none" }}>{ta.newOrder}</button>

                  </div>

                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))", gap:11, marginBottom:22 }}>

                      <div style={{ fontSize:10, color:"#888", marginBottom:5, textTransform:"uppercase", letterSpacing:0.6 }}>{label}</div>
                      <div style={{ fontSize:21, fontWeight:800, marginBottom:3, color:"#1A1A1A", fontFamily:"monospace" }}>

                      </div>
                      <div style={{ fontSize:11, color:"#999" }}>{ta.statsSub[i]}</div>
                    </div>
                  ))}
                </div>

                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap", background:"#FAFAF8", border:"1px solid #ECECEC", borderRadius:13, padding:"12px 14px", marginBottom:20 }}>
                  <div>
                    <div style={{ fontSize:13, fontWeight:800, color:"#1A1A1A" }}>{lang==="th"?"สำรองข้อมูล":"Backup data"}</div>
                    <div style={{ fontSize:12, color:"#777", marginTop:2 }}>{lang==="th"?"บันทึกหรือกู้คืนออเดอร์ สต็อก ลูกค้า และบัญชีแอดมิน":"Save or restore orders, stock, customers, and admin accounts"}</div>

                      <input value={googleSheetConfig.scriptUrl} onChange={e=>setGoogleSheetConfig(prev=>({...prev, scriptUrl:e.target.value}))} placeholder={lang==="th"?"วาง Google Apps Script URL ที่นี่":"Paste Google Apps Script URL here"} style={{ border:"1px solid #E0DDD8", borderRadius:9, padding:"9px 11px", fontSize:12, fontFamily:thF, minWidth:0 }} />
                      <input value={googleSheetConfig.token} onChange={e=>setGoogleSheetConfig(prev=>({...prev, token:e.target.value}))} placeholder={lang==="th"?"รหัสลับ ถ้ามี":"Secret token, optional"} style={{ border:"1px solid #E0DDD8", borderRadius:9, padding:"9px 11px", fontSize:12, fontFamily:thF, minWidth:0 }} />

      </main>

      {/* ── FOOTER ── */}
      <footer style={{ background:"#1A1A1A", color:"#888", padding:"40px 1.5rem", marginTop:60 }}>
        <div style={{ maxWidth:1200, margin:"0 auto", display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:24 }}>
          <div>
            <div style={{ color:"#fff", fontWeight:700, fontSize:18, marginBottom:8 }}>SKKJ Autopart</div>
            <div style={{ fontSize:13, lineHeight:1.7, whiteSpace:"pre-line" }}>{t.footer.tagline}</div>
          </div>
          <div style={{ fontSize:13, lineHeight:2 }}>
            <div style={{ color:"#fff", fontWeight:600, marginBottom:8 }}>{t.footer.quickLinks}</div>
            {navPages.map(p=><div key={p} style={{ cursor:"pointer" }} onClick={()=>setPage(p)}>{t.nav[p]}</div>)}
          </div>
          <div style={{ fontSize:13, lineHeight:2 }}>
            <div style={{ color:"#fff", fontWeight:600, marginBottom:8 }}>{t.footer.contactTitle}</div>
            <div>02-123-4567</div><div>skkjthailand@gmail.com</div><div>Bangkok, Thailand</div>
            <div style={{ marginTop:10, color:"#fff", fontWeight:600 }}>LINE</div>
            <img src="assets/line-qr.jpg" alt="SKKJ LINE QR code" style={{ width:86, height:86, objectFit:"cover", borderRadius:8, background:"#fff", padding:4, marginTop:4 }} />
          </div>
        </div>
        <div style={{ maxWidth:1200, margin:"20px auto 0", borderTop:"1px solid #333", paddingTop:20, fontSize:12, textAlign:"center" }}>{t.footer.copyright}</div>
      </footer>
      {showBackToTop && (
        <button className="back-to-top-btn" onClick={()=>window.scrollTo({ top:0, behavior:"smooth" })} title={lang==="th"?"กลับด้านบน":"Back to top"} aria-label="Back to top">
          ↑
        </button>
      )}

      {/* ══ COMPARE BAR (floating, shows when items selected) ══ */}
      {compareList.length > 0 && !compareOpen && (
        <div style={{ position:"fixed", left:"50%", bottom:18, transform:"translateX(-50%)", zIndex:9997, background:"#1A1A1A", color:"#fff", borderRadius:14, padding:"12px 16px", boxShadow:"0 12px 34px rgba(0,0,0,0.3)", display:"flex", alignItems:"center", gap:14, maxWidth:"calc(100vw - 28px)" }}>
          <span style={{ fontSize:13, fontWeight:800 }}>{lang==="th"?`เลือกเทียบ ${compareList.length} รายการ`:`${compareList.length} selected`}</span>
          <button onClick={()=>setCompareOpen(true)} disabled={compareList.length<2} style={{ background:compareList.length<2?"#555":"#fff", color:compareList.length<2?"#999":"#1A1A1A", border:"none", borderRadius:9, padding:"8px 14px", fontSize:13, fontWeight:900, cursor:compareList.length<2?"not-allowed":"pointer", fontFamily:thF }}>
            {lang==="th"?"เปรียบเทียบ":"Compare"}
          </button>
          <button onClick={()=>setCompareList([])} style={{ background:"transparent", color:"#aaa", border:"none", fontSize:18, cursor:"pointer", lineHeight:1 }}>×</button>
        </div>
      )}

      {/* ══ COMPARE MODAL ══ */}
      {compareOpen && compareList.length >= 2 && (() => {
        const items = compareList.map(c => {
          const b = brands.find(x => x.id===c.brandId);
          const m = b?.models.find(x => x.id===c.modelId);
          return b && m ? { brand:b, model:m } : null;
        }).filter(Boolean);
        if (items.length < 2) return null;
        const rows = [
          { label: lang==="th"?"ราคา":"Price", get:({model})=>fmt(model.price) },
          { label: lang==="th"?"สต็อก":"Stock", get:({model})=>model.stock===0?(lang==="th"?"หมด":"Out"):`${model.stock}` },
          { label: lang==="th"?"ปีรถ":"Years", get:({model})=>model.years||"-" },
          { label: lang==="th"?"พวงมาลัย":"Drive side", get:({model})=>getDriveSideLabel(getModelDriveSide(model), lang) },
          { label: lang==="th"?"ประเภท":"Part type", get:({model})=>getPartTypeLabel(getModelPartType(model), lang) },
          { label: lang==="th"?"รหัสสินค้า":"SKU", get:({model})=>model.sku||"-" },
        ];
        return (
          <div onClick={()=>setCompareOpen(false)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:10000, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
            <div onClick={e=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, maxWidth:760, width:"100%", maxHeight:"88vh", overflow:"auto", boxShadow:"0 24px 60px rgba(0,0,0,0.3)" }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"18px 20px", borderBottom:"1px solid #ECECEC", position:"sticky", top:0, background:"#fff" }}>
                <h3 style={{ margin:0, fontSize:18, fontWeight:900 }}>{lang==="th"?"เปรียบเทียบสินค้า":"Compare products"}</h3>
                <button onClick={()=>setCompareOpen(false)} style={{ width:30, height:30, borderRadius:15, border:"1px solid #E0DDD8", background:"#fff", cursor:"pointer", fontSize:18, lineHeight:1 }}>×</button>
              </div>
              <div style={{ padding:20, overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", minWidth:items.length*150 }}>
                  <thead>
                    <tr>
                      <th style={{ textAlign:"left", padding:"8px", fontSize:12, color:"#999", fontWeight:700, verticalAlign:"top", width:90 }}></th>
                      {items.map(({ brand, model }) => (
                        <th key={`${brand.id}-${model.id}`} style={{ padding:"8px", textAlign:"center", verticalAlign:"top" }}>
                          <div style={{ height:80, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:6 }}>
                            <ProductPhotoBox brand={brand} model={model} lang={lang} t={t} height={80} onMagnify={()=>{}} onOpenDetail={()=>{ setCompareOpen(false); openProductDetail(brand, model); }} />
                          </div>
                          <div style={{ fontSize:12.5, fontWeight:900, color:"#1A1A1A", lineHeight:1.3 }}>{lang==="th"?brand.nameTh:brand.nameEn} {lang==="th"?model.nameTh:model.nameEn}</div>
                          <button onClick={()=>toggleCompare(brand, model)} style={{ marginTop:5, background:"none", border:"none", color:"#E24B4A", fontSize:11, fontWeight:700, cursor:"pointer", fontFamily:thF }}>{lang==="th"?"นำออก":"Remove"}</button>
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((row, ri) => (
                      <tr key={ri} style={{ background:ri%2===0?"#FAFAF8":"#fff" }}>
                        <td style={{ padding:"10px 8px", fontSize:12, color:"#777", fontWeight:800 }}>{row.label}</td>
                        {items.map(item => (
                          <td key={`${item.brand.id}-${item.model.id}`} style={{ padding:"10px 8px", textAlign:"center", fontSize:13, fontWeight:700, color:"#1A1A1A" }}>{row.get(item)}</td>
                        ))}
                      </tr>
                    ))}
                    <tr>
                      <td style={{ padding:"10px 8px" }}></td>
                      {items.map(({ brand, model }) => (
                        <td key={`${brand.id}-${model.id}`} style={{ padding:"10px 8px", textAlign:"center" }}>
                          <button onClick={()=>{ setCompareOpen(false); openProductDetail(brand, model); }} style={{ background:"#1A1A1A", color:"#fff", border:"none", borderRadius:9, padding:"8px 12px", fontSize:12, fontWeight:900, cursor:"pointer", fontFamily:thF }}>{lang==="th"?"ดูสินค้า":"View"}</button>
                        </td>
                      ))}
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      })()}
      <div className="line-help-float" style={{ position:"fixed", right:18, bottom:18, zIndex:9999, display:"flex", flexDirection:"column", alignItems:"flex-end", gap:10 }}>

        {/* ── PRODUCT FINDER CARD ── */}
        {lineFinderOpen && (
          <div className="line-help-card" style={{ background:"#fff", border:"1px solid #E0DDD8", borderRadius:16, padding:14, boxShadow:"0 18px 44px rgba(0,0,0,0.18)", width:360, maxWidth:"calc(100vw - 28px)" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, marginBottom:8 }}>
              <div>
                <div style={{ fontSize:15, fontWeight:900, color:"#1A1A1A" }}>{t.finder.title}</div>
                <div style={{ fontSize:11.5, color:"#777", lineHeight:1.4, marginTop:2 }}>{t.finder.subtitle}</div>
              </div>
              <button type="button" onClick={()=>setLineFinderOpen(false)} style={{ width:26, height:26, borderRadius:13, border:"1px solid #E0DDD8", background:"#fff", cursor:"pointer", lineHeight:1, fontSize:16 }}>×</button>
            </div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", margin:"10px 0" }}>
              {t.finder.quickButtons.map(btn => (
                <button key={btn.label} type="button" onClick={()=>runProductFinder(btn.query)} style={{ background:"#FAFAF8", border:"1px solid #E0DDD8", borderRadius:999, padding:"6px 9px", fontSize:11.5, fontWeight:800, color:"#1A1A1A", cursor:"pointer", fontFamily:thF }}>
                  {btn.label}
                </button>
              ))}
            </div>
            <div style={{ maxHeight:260, overflowY:"auto", display:"grid", gap:8, paddingRight:2 }}>
              {finderMessages.map((msg, idx) => (
                <div key={idx} style={{ justifySelf:msg.role==="user"?"end":"start", maxWidth:"100%" }}>
                  <div style={{ background:msg.role==="user"?"#1A1A1A":"#F8F7F4", color:msg.role==="user"?"#fff":"#1A1A1A", border:"1px solid "+(msg.role==="user"?"#1A1A1A":"#ECECEC"), borderRadius:12, padding:"8px 10px", fontSize:12.5, lineHeight:1.45, fontWeight:700 }}>
                    {msg.text}
                  </div>
                  {Array.isArray(msg.results) && msg.results.length > 0 && (
                    <div style={{ display:"grid", gap:6, marginTop:6 }}>
                      {msg.results.map(({ brand, model }) => {
                        const replyLang = msg.lang || lang;
                        const name = replyLang==="th" ? `${brand.nameTh} ${model.nameTh}` : `${brand.nameEn} ${model.nameEn}`;
                        return (
                          <div key={`${brand.id}-${model.id}`} style={{ border:"1px solid #E0DDD8", borderRadius:12, padding:8, background:"#fff" }}>
                            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                              <BrandLogo logo={brand.logo} size={18} place="navFilter" />
                              <div style={{ flex:1, minWidth:0 }}>
                                <div style={{ fontWeight:900, fontSize:12.5, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{name}</div>
                                <div style={{ fontSize:11, color:"#777" }}>{model.years || "-"} · {fmt(model.price)}</div>
                              </div>
                            </div>
                            <div style={{ display:"flex", gap:6, marginTop:7 }}>
                              <button type="button" onClick={()=>{ openProductDetail(brand, model); setLineFinderOpen(false); }} style={{ flex:1, border:"1px solid #1A1A1A", background:"#1A1A1A", color:"#fff", borderRadius:9, padding:"7px 8px", fontSize:11.5, fontWeight:900, cursor:"pointer", fontFamily:thF }}>{T[replyLang].finder.view}</button>
                              <button type="button" onClick={()=>openLineForProduct(brand, model)} style={{ flex:1, border:"1px solid #06C755", background:"#fff", color:"#06A846", borderRadius:9, padding:"7px 8px", fontSize:11.5, fontWeight:900, cursor:"pointer", fontFamily:thF }}>{T[replyLang].finder.askLine}</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div style={{ display:"flex", gap:7, marginTop:10 }}>
              <input value={finderQuery} onChange={e=>setFinderQuery(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") runProductFinder(finderQuery); }} placeholder={t.finder.placeholder} style={{ ...iSLight, padding:"9px 10px", fontSize:12.5 }} />
              <button type="button" onClick={()=>runProductFinder(finderQuery)} style={{ background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, padding:"0 12px", fontSize:12, fontWeight:900, cursor:"pointer", fontFamily:thF }}>{t.finder.send}</button>
            </div>
          </div>
        )}

        {/* ── LINE CONTACT CARD ── */}
        {lineContactOpen && (
          <div className="line-help-line-card" style={{ background:"#fff", border:"1px solid #DDF3E5", borderRadius:16, padding:12, boxShadow:"0 16px 38px rgba(6,199,85,0.18)", width:360, maxWidth:"calc(100vw - 28px)", display:"grid", gridTemplateColumns:"62px 1fr", alignItems:"center", gap:10, position:"relative" }}>
            <button type="button" onClick={()=>setLineContactOpen(false)} style={{ position:"absolute", top:8, right:8, width:22, height:22, borderRadius:11, border:"1px solid #D0EBD9", background:"#F0FDF4", cursor:"pointer", lineHeight:1, fontSize:13, color:"#166534" }}>×</button>
            <img src="assets/line-qr.jpg" alt="SKKJ LINE QR code" style={{ width:62, height:62, objectFit:"cover", border:"1px solid #ECECEC", borderRadius:10, display:"block", background:"#fff" }} />
            <div style={{ minWidth:0 }}>
              <div style={{ fontSize:13, fontWeight:900, color:"#1A1A1A", marginBottom:2 }}>{lang==="th"?"LINE ร้าน SKKJ":"SKKJ LINE"}</div>
              <div style={{ fontSize:11.5, color:"#666", lineHeight:1.45 }}>{lang==="th"?"สแกน QR เพื่อส่งรูปอะไหล่หรือถามพนักงานได้เลย":"Scan the QR to send photos or ask our staff."}</div>
              <button type="button" onClick={()=>window.open("https://line.me/R/ti/p/@skkjautopart","_blank","noopener,noreferrer")} style={{ marginTop:7, background:"#06C755", color:"#fff", border:"none", borderRadius:999, padding:"7px 11px", fontSize:11.5, fontWeight:900, cursor:"pointer", fontFamily:thF }}>
                {lang==="th"?"เปิด LINE":"Open LINE"}
              </button>
            </div>
          </div>
        )}

        {/* ── TWO SEPARATE BUTTONS ── */}
        <div style={{ display:"flex", gap:8, alignItems:"center", justifyContent:"flex-end" }}>
          <button className="line-help-button" onClick={()=>{ setLineFinderOpen(v=>!v); setLineContactOpen(false); }} style={{ background:lineFinderOpen?"#1A1A1A":"#F0EEE8", color:lineFinderOpen?"#fff":"#1A1A1A", border:"1px solid "+(lineFinderOpen?"#1A1A1A":"#E0DDD8"), borderRadius:999, padding:"11px 14px", cursor:"pointer", fontSize:13, fontWeight:900, fontFamily:thF, boxShadow:"0 6px 18px rgba(0,0,0,0.14)", display:"flex", alignItems:"center", gap:7 }}>
            <span style={{ fontSize:15 }}>🔍</span>
            {lang==="th"?"หาอะไหล่":"Find parts"}
          </button>
          <button className="line-help-button" onClick={()=>{ setLineContactOpen(v=>!v); setLineFinderOpen(false); }} style={{ background:"#06C755", color:"#fff", border:"none", borderRadius:999, padding:"11px 14px", cursor:"pointer", fontSize:13, fontWeight:900, fontFamily:thF, boxShadow:"0 10px 28px rgba(0,0,0,0.28)", display:"flex", alignItems:"center", gap:7 }}>
            <span style={{ width:20, height:20, borderRadius:10, background:"#fff", color:"#06C755", display:"inline-flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:900 }}>L</span>
            {lang==="th"?"LINE ถามร้าน":"LINE Help"}
          </button>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
