function hasThaiText(value) { return THAI_RE.test(String(value || "")); }
function normalizeSearchText(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[\s\-_./()]+/g, "")
    .replace(/[^\u0E00-\u0E7Fa-z0-9]/g, "");
}
function detectFinderLang(value) {
  const text = String(value || "");
  return hasThaiText(text) ? "th" : /[a-z]/i.test(text) ? "en" : "th";
}
function splitAliasText(value) {
  return Array.isArray(value) ? value.filter(Boolean) : String(value || "").split(/[\n,|]+/).map(v=>v.trim()).filter(Boolean);
}
function partTypeText(type, lang="th") {
  const entry = PART_TYPE_I18N[type || "steering_rack"] || PART_TYPE_I18N.steering_rack;
  return entry[lang] || entry.th;
}
function getAliasTermsFromText(text) {
  const normalized = normalizeSearchText(text);
  const terms = [];
  MODEL_ALIAS_GROUPS.forEach(group => {
    if (group.some(alias => normalized.includes(normalizeSearchText(alias)))) terms.push(...group);
  });
  return [...new Set(terms)];
}
function enrichProductI18n(brand, model) {
  const brandInfo = BRAND_I18N[brand?.id] || { th:brand?.nameTh || "", en:brand?.nameEn || "" };
  const type = model?.partType || "steering_rack";
  const baseText = [
    brand?.id, brand?.nameTh, brand?.nameEn, model?.nameTh, model?.nameEn,
    model?.sku, model?.years, model?.driveBody, partTypeText(type, "th"), partTypeText(type, "en")
  ].join(" ");
  const aliases = [...new Set([
    ...splitAliasText(model?.model_aliases || model?.modelAliases),
    ...getAliasTermsFromText(baseText),
  ])];
  return {
    name_th:model?.name_th || model?.nameTh || "",
    name_en:model?.name_en || model?.nameEn || "",
    brand_th:model?.brand_th || brandInfo.th || brand?.nameTh || "",
    brand_en:model?.brand_en || brandInfo.en || brand?.nameEn || "",
    model_th:model?.model_th || model?.nameTh || "",
    model_en:model?.model_en || model?.nameEn || "",
    model_aliases:aliases,
    part_type_th:model?.part_type_th || partTypeText(type, "th"),
    part_type_en:model?.part_type_en || partTypeText(type, "en"),
    keywords_th:splitAliasText(model?.keywords_th || model?.keywordsTh),
    keywords_en:splitAliasText(model?.keywords_en || model?.keywordsEn),
  };
}
function productSearchHaystack(brand, model) {
  const i18n = enrichProductI18n(brand, model);
  return [
    i18n.name_th, i18n.name_en, i18n.brand_th, i18n.brand_en,
    i18n.model_th, i18n.model_en, i18n.part_type_th, i18n.part_type_en,
    ...(i18n.model_aliases || []), ...(i18n.keywords_th || []), ...(i18n.keywords_en || []),
    model?.nameTh, model?.nameEn, model?.sku, model?.years, model?.driveBody,
    brand?.id, brand?.nameTh, brand?.nameEn
  ].join(" ");
}
function productMatchesQuery(brand, model, query) {
  const q = normalizeSearchText(query);
  if (!q) return true;
  return normalizeSearchText(productSearchHaystack(brand, model)).includes(q);
}
function findProductsByQuery(brands, query, options={}) {
  const q = String(query || "").trim();
  if (!q) return [];
  return brands.flatMap(brand => (brand.models || []).map(model => ({ brand, model })))
    .filter(({ brand, model }) => {
      if (options.partType && options.partType !== "all" && (model.partType || "steering_rack") !== options.partType) return false;
      if (options.driveSide && options.driveSide !== "all" && (model.driveSide || "right") !== options.driveSide) return false;
      if (options.hideNoPhoto && !model.productImage && !(Array.isArray(model.productImages) && model.productImages.length)) return false;
      return productMatchesQuery(brand, model, q);
    });
}

function readSlipFile(file) {
  return new Promise(resolve => {
    if (!file || !file.size) { resolve(""); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result || "");
    reader.onerror = () => resolve("");
    reader.readAsDataURL(file);
  });
}

function SmoothSizeCard({ children, className="", style={} }) {
  const outerRef = useRef(null);
  const innerRef = useRef(null);
  const [height, setHeight] = useState(null);

  useEffect(() => {
    const outer = outerRef.current;
    const inner = innerRef.current;
    if (!outer || !inner) return;
    let frame = 0;
    const update = () => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const computed = window.getComputedStyle(outer);
        const paddingY = parseFloat(computed.paddingTop || 0) + parseFloat(computed.paddingBottom || 0);
        const max = Math.max(260, Math.floor(window.innerHeight * 0.86));
        setHeight(Math.min(inner.scrollHeight + paddingY, max));
      });
    };
    update();
    const observer = typeof ResizeObserver !== "undefined" ? new ResizeObserver(update) : null;
    observer?.observe(inner);
    window.addEventListener("resize", update);
    return () => {
      cancelAnimationFrame(frame);
      observer?.disconnect();
      window.removeEventListener("resize", update);
    };
  }, [children]);

  return (
    <div ref={outerRef} className={className} style={{ ...style, height:height ? `${height}px` : "auto", overflowY:"auto", transition:"height 560ms cubic-bezier(.22,1,.36,1), max-width 420ms cubic-bezier(.22,1,.36,1), transform 240ms ease" }}>
      <div ref={innerRef}>{children}</div>
    </div>
  );
}

function getModelGalleryImages(model) {
  const images = [];
  const add = (item) => {
    const src = typeof item === "string" ? item : item?.src;
    if (!src || images.some(existing => existing.src === src)) return;
    images.push({
      src,
      name: (typeof item === "string" ? "" : item?.name) || model.imageFileName || "",
    });
  };
  (Array.isArray(model.productImages) ? model.productImages : []).forEach(add);
  if (model.productImage) add({ src:model.productImage, name:model.imageFileName || "" });
  return images;
}

function productHasPhoto(model) {
  return getModelGalleryImages(model).length > 0;
}

function getProductMainImage(model) {
  return getModelGalleryImages(model)[0]?.src || "";
}

function getProductSlides(brand, model, lang) {
  const brandName = lang==="th" ? brand.nameTh : brand.nameEn;
  const modelName = lang==="th" ? model.nameTh : model.nameEn;
  const slides = [];
  getModelGalleryImages(model).forEach((image, index) => {
    slides.push({ type:"image", src:image.src, label:lang==="th"?`รูปสินค้า ${index+1}`:`Product photo ${index+1}`, title:`${brandName} ${modelName}`, name:image.name || "" });
  });
  slides.push({ type:"brand", label:lang==="th"?"ยี่ห้อรถ":"Brand", title:brandName });
  return slides;
}

function ProductPhotoBox({ brand, model, lang, t, height=178, onMagnify, onOpenDetail }) {
  const [idx, setIdx] = useState(0);
  const [failedImages, setFailedImages] = useState({});
  const slides = getProductSlides(brand, model, lang);
  const slide = slides[idx] || slides[0];
  const showImage = slide.type==="image" && !failedImages[slide.src];
  const ss = stockStatus(model.stock);
  const canMove = slides.length > 1;
  const move = (delta) => setIdx(prev => (prev + delta + slides.length) % slides.length);
  const fit = showImage && model.photoFit ? model.photoFit : {};
  const imageTransform = `translate(${fit.x || 0}px, ${fit.y || 0}px) rotate(${fit.rotate || 0}deg)`;

  return (
    <div className="product-photo-box" onClick={()=>onOpenDetail?.()} style={{ height, background:"linear-gradient(135deg,#F8F6EF 0%,#FFFFFF 48%,#F2EFE8 100%)", borderBottom:"1px solid #E8E6E0", display:"flex", alignItems:"center", justifyContent:"center", position:"relative", overflow:"hidden", cursor:onOpenDetail?"pointer":"default" }}>

      <div style={{ position:"absolute", top:10, right:10, background:ss.bg, color:ss.color, borderRadius:20, padding:"4px 10px", fontSize:10, fontWeight:800, border:`1px solid ${ss.color}30`, zIndex:2 }}>
        {model.stock} {t.inStock}
      </div>
      {showImage ? (
        <img className="product-main-image" src={slide.src} alt={slide.title} loading="lazy" onError={()=>setFailedImages(prev=>({ ...prev, [slide.src]:true }))} style={{ width:fit.width || "92%", height:fit.height || "86%", objectFit:"contain", objectPosition:fit.objectPosition || "center center", position:"relative", zIndex:1, filter:"none", transform:imageTransform }} />
      ) : (
        <div style={{ position:"relative", zIndex:1, textAlign:"center", display:"flex", flexDirection:"column", alignItems:"center", gap:10 }}>
          <BrandLogo logo={brand.logo} size={54} place="productPhoto" />

      )}
      <button type="button" onClick={(e)=>{ e.stopPropagation(); canMove && move(-1); }} style={{ position:"absolute", left:8, top:"50%", transform:"translateY(-50%)", width:34, height:42, border:"none", background:"rgba(255,255,255,0.78)", color:"#1A1A1A", borderRadius:10, cursor:canMove?"pointer":"default", fontSize:26, lineHeight:1, zIndex:3, opacity:canMove?1:0.35 }}>‹</button>
      <button type="button" onClick={(e)=>{ e.stopPropagation(); canMove && move(1); }} style={{ position:"absolute", right:8, top:"50%", transform:"translateY(-50%)", width:34, height:42, border:"none", background:"rgba(255,255,255,0.78)", color:"#1A1A1A", borderRadius:10, cursor:canMove?"pointer":"default", fontSize:26, lineHeight:1, zIndex:3, opacity:canMove?1:0.35 }}>›</button>
      <button type="button" disabled={!showImage} onClick={(e)=>{ e.stopPropagation(); showImage && onMagnify?.(slide); }} title={lang==="th"?"ดูรูปใหญ่":"View larger"} style={{ position:"absolute", left:10, bottom:10, width:34, height:34, borderRadius:10, border:"1px solid rgba(0,0,0,0.08)", background:"rgba(255,255,255,0.88)", cursor:showImage?"pointer":"default", zIndex:3, fontSize:16, opacity:showImage?1:0.45 }}>⌕</button>
      <div style={{ position:"absolute", right:12, bottom:12, display:"flex", gap:4, zIndex:3 }}>
        {slides.map((s,i)=><span key={`${s.type}-${i}`} style={{ width:i===idx?14:5, height:5, borderRadius:20, background:i===idx?"#1A1A1A":"#CFC7B8", transition:"all 0.2s" }} />)}
      </div>
    </div>
  );

  const s = stockStatus(stock);
  const label = lang==="th" ? s.labelTh : s.labelEn;
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:5, background:s.bg, color:s.color, borderRadius:20, padding:"3px 9px", fontSize:10, fontWeight:700, letterSpacing:0.3, whiteSpace:"nowrap", border:`1px solid ${s.color}22` }}>
      <span style={{ width:5, height:5, borderRadius:"50%", background:s.color, boxShadow:`0 0 5px ${s.color}` }} />
      {label}
    </span>
  );
}

// ─── BASKET PANEL ─────────────────────────────────────────────────────────────
function BasketPanel({ open, onClose, basket, setBasket, brands, lang, t, onCheckout }) {
  const tb = t.basket;
  const thF = lang==="th" ? "'Sarabun','Helvetica Neue',Arial,sans-serif" : "'Helvetica Neue',Arial,sans-serif";
  const [shipping, setShipping] = useState("standard");
  const [toasts, setToasts] = useState([]);
  const toastRef = useRef(0);

  const addToast = useCallback((msg, type="success") => {
    const id = ++toastRef.current;
    setToasts(p => [...p, { id, message:msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000);
  }, []);

  const shippingCost = 0;
  const subtotal = basket.reduce((s, item) => s + item.price * item.quantity, 0);
  const total = subtotal + shippingCost;
  const totalQty = basket.reduce((s, item) => s + item.quantity, 0);

  const updateQty = (modelId, delta) => {
    setBasket(prev => prev.map(item => {
      if (item.modelId !== modelId) return item;
      const liveStock = getLiveStock(brands, item.brandId, item.modelId);
      const next = item.quantity + delta;
      if (next < 1) return item;
      if (next > liveStock) { addToast(tb.maxStock, "error"); return item; }
      return { ...item, quantity: next };
    }));
  };

  const removeItem = (modelId) => {
    setBasket(prev => prev.filter(item => item.modelId !== modelId));
  };

  const shippingLabels = { standard: tb.standard, express: tb.express, pickup: tb.pickup };
  const estDelivery = { standard: lang==="th" ? "2–5 วัน" : "2–5 days", express: lang==="th" ? "2–5 วัน" : "2–5 days", pickup: lang==="th" ? "รับที่ร้าน" : "At shop" };

  if (!open) return null;

  return (
    <>
      {/* Overlay */}
      <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", zIndex:150, backdropFilter:"blur(2px)" }} />

      {/* Drawer */}
      <div style={{
        position:"fixed", top:0, right:0, bottom:0, zIndex:151,
        width:"min(480px, 100vw)", background:"#fff",
        boxShadow:"-8px 0 40px rgba(0,0,0,0.15)",
        display:"flex", flexDirection:"column",
        animation:"slideInRight 0.28s cubic-bezier(0.22,1,0.36,1)",
        fontFamily: thF,
      }}>
        {/* Header */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"18px 20px", borderBottom:"1px solid #ECECEC", flexShrink:0 }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ fontSize:20 }}>🛒</span>
            <h2 style={{ margin:0, fontSize:17, fontWeight:800, letterSpacing:"-0.3px" }}>{tb.title}</h2>
            {totalQty > 0 && (
              <span style={{ background:"#1A1A1A", color:"#fff", borderRadius:20, padding:"2px 9px", fontSize:12, fontWeight:700 }}>{totalQty}</span>
            )}
          </div>
          <button onClick={onClose} style={{ background:"#F0EEE8", border:"none", borderRadius:8, width:32, height:32, cursor:"pointer", fontSize:18, color:"#555", display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
        </div>

        {/* Body */}
        <div style={{ flex:1, overflowY:"auto", padding:"12px 20px" }}>
          {basket.length === 0 ? (
            <div style={{ textAlign:"center", padding:"60px 20px" }}>
              <div style={{ fontSize:48, marginBottom:16 }}>🛒</div>
              <p style={{ fontSize:16, fontWeight:600, color:"#555", marginBottom:8 }}>{tb.empty}</p>
              <button onClick={onClose} style={{ background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, padding:"10px 20px", cursor:"pointer", fontSize:13, fontWeight:600, marginTop:8, fontFamily:thF }}>{tb.browse}</button>
            </div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {basket.map(item => {
                const liveStock = getLiveStock(brands, item.brandId, item.modelId);
                const itemName = lang==="th" ? `${item.brandNameTh} ${item.modelNameTh}` : `${item.brandNameEn} ${item.modelNameEn}`;
                const stockOk = liveStock > 0 && item.quantity <= liveStock;
                return (
                  <div key={item.modelId} style={{ background: stockOk ? "#FAFAF8" : "#FFF5F5", border:`1px solid ${stockOk?"#ECECEC":"#FECACA"}`, borderRadius:12, padding:"14px 16px" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10 }}>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontWeight:700, fontSize:13, color:"#1A1A1A", marginBottom:2, lineHeight:1.4 }}>{itemName}</div>
                        {item.years && <div style={{ fontSize:11, color:"#999", marginBottom:3 }}>{item.years}</div>}
                        <div style={{ fontFamily:"monospace", fontSize:10, color:"#BBB", marginBottom:6 }}>{item.sku}</div>
                        {!stockOk && (
                          <div style={{ fontSize:11, color:"#ef4444", fontWeight:600, marginBottom:4 }}>
                            ⚠ {lang==="th" ? `มีสต็อกเพียง ${liveStock} ชิ้น` : `Only ${liveStock} in stock`}
                          </div>
                        )}
                        {/* Qty controls */}
                        <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:4 }}>
                          <button onClick={()=>updateQty(item.modelId,-1)} disabled={item.quantity<=1}
                            style={{ width:28, height:28, borderRadius:7, border:"1px solid #E0DDD8", background:"#fff", cursor:item.quantity<=1?"not-allowed":"pointer", fontSize:15, fontWeight:700, color:"#555", display:"flex", alignItems:"center", justifyContent:"center", opacity:item.quantity<=1?0.4:1 }}>−</button>
                          <span style={{ fontWeight:700, fontSize:15, minWidth:24, textAlign:"center", fontFamily:"monospace" }}>{item.quantity}</span>
                          <button onClick={()=>updateQty(item.modelId,1)} disabled={item.quantity>=liveStock}
                            style={{ width:28, height:28, borderRadius:7, border:"1px solid #E0DDD8", background:"#fff", cursor:item.quantity>=liveStock?"not-allowed":"pointer", fontSize:15, fontWeight:700, color:"#555", display:"flex", alignItems:"center", justifyContent:"center", opacity:item.quantity>=liveStock?0.4:1 }}>+</button>
                          <button onClick={()=>removeItem(item.modelId)}
                            style={{ marginLeft:"auto", background:"none", border:"none", color:"#ef4444", cursor:"pointer", fontSize:11, fontWeight:600, padding:"4px 6px", borderRadius:6 }}>{tb.remove}</button>
                        </div>
                      </div>
                      <div style={{ textAlign:"right", flexShrink:0 }}>
                        <div style={{ fontWeight:800, fontSize:15, color:"#1A1A1A" }}>{fmt(item.price * item.quantity)}</div>
                        <div style={{ fontSize:11, color:"#AAA", marginTop:2 }}>{fmt(item.price)} × {item.quantity}</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Shipping */}
          {basket.length > 0 && (
            <div style={{ marginTop:20 }}>
              <div style={{ background:"#F0FDF4", border:"1px solid #BBF7D0", borderRadius:12, padding:"12px 14px", display:"flex", alignItems:"flex-start", gap:10 }}>
                <span style={{ color:"#16A34A", fontWeight:900, fontSize:16 }}>✓</span>
                <div>
                  <div style={{ fontSize:13, fontWeight:800, color:"#166534" }}>{lang==="th"?"จัดส่งฟรี":"Free shipping"}</div>
                  <div style={{ fontSize:11, color:"#166534", marginTop:2 }}>{tb.estDelivery} {estDelivery.standard}</div>
                </div>
              </div>
            </div>
          )}
        </div>

        {/* Footer / Summary */}
        {basket.length > 0 && (
          <div style={{ borderTop:"1px solid #ECECEC", padding:"16px 20px", flexShrink:0, background:"#fff" }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, color:"#888", marginBottom:6 }}>
              <span>{tb.subtotal}</span><span style={{ color:"#1A1A1A", fontWeight:600 }}>{fmt(subtotal)}</span>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, color:"#888", marginBottom:12 }}>
              <span>{tb.shipping}</span><span style={{ color:"#1A1A1A", fontWeight:600 }}>{shippingCost===0?(lang==="th"?"ฟรี":"Free"):fmt(shippingCost)}</span>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:16, fontWeight:800, borderTop:"1px solid #ECECEC", paddingTop:12, marginBottom:14 }}>
              <span>{tb.total}</span><span>{fmt(total)}</span>
            </div>
            <button
              onClick={() => onCheckout(shipping)}
              style={{ width:"100%", background:"linear-gradient(135deg,#1A1A1A,#333)", color:"#fff", border:"none", borderRadius:12, padding:"14px", fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:thF, letterSpacing:"-0.2px" }}>
              {tb.proceed} →
            </button>
          </div>
        )}
      </div>
      <Toast toasts={toasts} />
    </>
  );
}

// ─── BASKET CHECKOUT MODAL ────────────────────────────────────────────────────
function SavedAddressPicker({ addresses=[], lang, selectedId, onSelect }) {
  if (!addresses.length) return null;
  return (
    <div style={{ background:"#FAFAF8", border:"1px solid #ECECEC", borderRadius:12, padding:12 }}>
      <div style={{ fontSize:12, fontWeight:900, color:"#1A1A1A", marginBottom:8 }}>
        {lang==="th" ? "ใช้ที่อยู่ที่เคยบันทึกไว้" : "Use a saved address"}
      </div>
      <div style={{ display:"flex", gap:8, overflowX:"auto", paddingBottom:2 }}>
        {addresses.map((addr, i) => (
          <button type="button" key={addr.id || i} onClick={()=>onSelect(addr)}
            style={{ flex:"0 0 min(230px,72vw)", textAlign:"left", background:selectedId===(addr.id || String(i))?"#1A1A1A":"#fff", color:selectedId===(addr.id || String(i))?"#fff":"#1A1A1A", border:"1px solid #E0DDD8", borderRadius:10, padding:"10px 11px", cursor:"pointer", fontFamily:"inherit" }}>
            <div style={{ fontSize:12, fontWeight:900, marginBottom:4 }}>{addr.label || (lang==="th" ? `ที่อยู่ ${i+1}` : `Address ${i+1}`)}</div>
            <div style={{ fontSize:11, opacity:.72, lineHeight:1.35, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{addr.customer || ""} {addr.phone ? `· ${addr.phone}` : ""}</div>
            <div style={{ fontSize:11, opacity:.72, lineHeight:1.35, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{addr.address}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

function BasketCheckout({ basket, shipping, lang, t, onConfirm, onClose, customer, savedAddresses=[] }) {
  const tb = t.basket;
  const thF = lang==="th" ? "'Sarabun','Helvetica Neue',Arial,sans-serif" : "'Helvetica Neue',Arial,sans-serif";
  const shippingCost = 0;
  const total = basket.reduce((s, i) => s + i.price * i.quantity, 0) + shippingCost;
  const [step, setStep] = useState(1);
  const firstAddress = savedAddresses[0];
  const [selectedSavedAddress, setSelectedSavedAddress] = useState(firstAddress?.id || "");
  const [details, setDetails] = useState({
    customer:firstAddress?.customer || customer?.name || "",
    phone:firstAddress?.phone || customer?.phone || "",
    address:firstAddress?.address || "",
    year:"",
    notes:"",
  });
  const [paymentMethod, setPaymentMethod] = useState("promptpay");
  const [deliveryMethod, setDeliveryMethod] = useState("standard");
  useEffect(() => {
    if (deliveryMethod==="express_bkk" && paymentMethod==="cod") setPaymentMethod("promptpay");
  }, [deliveryMethod, paymentMethod]);

  function handleDetailsSubmit(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    setDetails({ customer: fd.get("customer"), phone: fd.get("phone"), address: fd.get("address"), year:"", notes: fd.get("notes") });
    setStep(2);
  }

  function useSavedAddress(addr) {
    setSelectedSavedAddress(addr.id || "");
    setDetails(prev => ({
      ...prev,
      customer:addr.customer || prev.customer || customer?.name || "",
      phone:addr.phone || prev.phone || customer?.phone || "",
      address:addr.address || "",
    }));
  }

  async function handleSlipSubmit(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const slipFile = fd.get("paymentSlip");
    const paymentSlip = await readSlipFile(slipFile);
    onConfirm({ ...details, deliveryMethod, paymentSlip, paymentSlipName: slipFile?.name || "", paymentMethod, paymentStatus:"waiting_review" });
  }

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:210, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <SmoothSizeCard className="skkj-modal-card" style={{ background:"#fff", borderRadius:18, padding:24, width:"100%", maxWidth:460, maxHeight:"86vh", fontFamily:thF, position:"relative" }}>
        <h3 style={{ margin:"0 0 4px", fontSize:19, fontWeight:800 }}>{tb.checkoutTitle}</h3>
        <p style={{ margin:"0 0 12px", color:"#888", fontSize:13 }}>{tb.checkoutSub} {basket.length} {tb.checkoutItems}</p>
        <div className="checkout-stepper">
          {[
            { id:1, th:"ที่อยู่", en:"Address" },
            { id:2, th:"จัดส่ง / จ่ายเงิน", en:"Delivery / payment" },
            { id:3, th:"สลิป", en:"Slip" },
          ].map(item => (
            <div key={item.id} className={`checkout-step ${step===item.id ? "is-current" : step>item.id ? "is-done" : ""}`}>
              <span>{step>item.id ? "✓" : item.id}</span>
              <strong>{lang==="th" ? item.th : item.en}</strong>
            </div>
          ))}
        </div>

        {/* Item summary */}
        <div className="checkout-summary" style={{ background:"#F8F7F4", borderRadius:10, padding:"10px 14px", marginBottom:18 }}>
          {basket.map(item => (
            <div key={item.modelId} style={{ display:"flex", justifyContent:"space-between", fontSize:12, padding:"4px 0", borderBottom:"1px solid #F0EEE8" }}>
              <span style={{ color:"#555" }}>{lang==="th" ? `${item.brandNameTh} ${item.modelNameTh}` : `${item.brandNameEn} ${item.modelNameEn}`} × {item.quantity}</span>
              <span style={{ fontWeight:700 }}>{fmt(item.price * item.quantity)}</span>
            </div>
          ))}
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, fontWeight:800, paddingTop:8, marginTop:4 }}>
            <span>{tb.total}</span><span>{fmt(total)}</span>
          </div>
        </div>

        {step===1&&<form className="checkout-form" onSubmit={handleDetailsSubmit} style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <SavedAddressPicker addresses={savedAddresses} lang={lang} selectedId={selectedSavedAddress} onSelect={useSavedAddress} />
          <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:5 }}>{t.order.namePh.replace("Your full name","Full Name").replace("ชื่อ-นามสกุล","ชื่อ-นามสกุล")}</label>
            <input name="customer" required value={details?.customer || ""} onChange={e=>setDetails(prev=>({...prev, customer:e.target.value}))} placeholder={t.order.namePh} style={iSLight} /></div>
          <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:5 }}>{t.contact.phone}</label>
            <input name="phone" required value={details?.phone || ""} onChange={e=>setDetails(prev=>({...prev, phone:e.target.value}))} placeholder={t.order.phonePh} style={iSLight} /></div>
          <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:5 }}>{lang==="th" ? "\u0e17\u0e35\u0e48\u0e2d\u0e22\u0e39\u0e48\u0e08\u0e31\u0e14\u0e2a\u0e48\u0e07" : "Delivery address"}</label>
            <textarea name="address" required value={details?.address || ""} onChange={e=>setDetails(prev=>({...prev, address:e.target.value}))} placeholder={lang==="th" ? "\u0e01\u0e23\u0e2d\u0e01\u0e17\u0e35\u0e48\u0e2d\u0e22\u0e39\u0e48\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e15\u0e34\u0e14\u0e2b\u0e19\u0e49\u0e32\u0e01\u0e25\u0e48\u0e2d\u0e07" : "Full address for delivery label"} rows={3} style={{ ...iSLight, resize:"vertical" }} /></div>
          <div><label style={{ fontSize:12, color:"#888", display:"block", marginBottom:5 }}>{lang==="th"?"หมายเหตุถึงร้าน":"Note for SKKJ"}</label>
            <textarea name="notes" value={details?.notes || ""} onChange={e=>setDetails(prev=>({...prev, notes:e.target.value}))} placeholder={t.order.notesPh} rows={3} style={{ ...iSLight, resize:"vertical" }} />
            <div style={{ color:"#dc2626", fontSize:12, fontWeight:800, lineHeight:1.55, marginTop:7 }}>
              การเสียหายของพัสดุเกิดจากบริษัทขนส่งสินค้านั้นทำการโยนพัสดุ และนี่อยู่นอกเหนือการควบคุมของบริษัท
            </div>
          </div>
          <TermsAgreement lang={lang} />
          <div style={{ display:"none" }}>
            <div style={{ fontWeight:800, fontSize:13, marginBottom:6 }}>{lang==="th"?"ชำระเงิน / แนบสลิป":"Payment / Slip upload"}</div>
            <div style={{ fontSize:12, color:"#666", lineHeight:1.5, marginBottom:10 }}>{lang==="th"?"หลังโอนเงิน กรุณาแนบรูปสลิปเพื่อให้แอดมินตรวจสอบ":"After transfer, upload the payment slip so admin can check it."}</div>
            <input name="paymentSlip" type="file" accept="image/*" disabled style={{ display:"none" }} />
          </div>
          <div className="checkout-actions" style={{ display:"flex", gap:10, marginTop:6 }}>
            <button type="button" onClick={onClose} style={{ flex:1, padding:12, border:"1px solid #ddd", borderRadius:10, background:"#fff", cursor:"pointer", fontSize:14, fontFamily:thF }}>{t.order.cancel}</button>
            <button type="submit" style={{ flex:2, padding:12, background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontSize:14, fontWeight:700, fontFamily:thF }}>{lang==="th"?"เลือกจัดส่ง / จ่ายเงิน":"Choose delivery / payment"}</button>
          </div>
        </form>}

        {step===2&&(
          <div className="checkout-form" style={{ display:"flex", flexDirection:"column", gap:14 }}>
            <div>
              <div style={{ fontSize:13, fontWeight:900, marginBottom:8 }}>{lang==="th"?"เลือกวิธีจัดส่ง":"Choose delivery method"}</div>
              <DeliveryMethodSelector lang={lang} value={deliveryMethod} onChange={setDeliveryMethod} />
            </div>
            <div>
              <div style={{ fontSize:13, fontWeight:900, marginBottom:8 }}>{lang==="th"?"เลือกวิธีจ่ายเงิน":"Choose payment method"}</div>
              <PaymentMethodSelector lang={lang} value={paymentMethod} onChange={setPaymentMethod} hideCod={deliveryMethod==="express_bkk"} />
              {deliveryMethod==="express_bkk" && <div style={{ marginTop:8, color:"#9A0018", fontSize:12, fontWeight:800, lineHeight:1.5 }}>{lang==="th"?"ส่งด่วนไม่สามารถเลือกเก็บเงินปลายทางได้":"Cash on delivery is not available for express delivery."}</div>}
            </div>
            {paymentMethod==="bank_transfer" && <BankTransferBox lang={lang} amount={total} />}
            {paymentMethod==="promptpay" && <PromptPayBox lang={lang} amount={total} />}
            {paymentMethod==="cod" && <CashOnDeliveryBox lang={lang} amount={total} />}
            <div className="checkout-actions" style={{ display:"flex", gap:10, marginTop:4 }}>
              <button type="button" onClick={()=>setStep(1)} style={{ flex:1, padding:12, border:"1px solid #ddd", borderRadius:10, background:"#fff", cursor:"pointer", fontSize:14, fontFamily:thF }}>{lang==="th"?"กลับ":"Back"}</button>
              {paymentMethod==="cod" ? (
                <button type="button" onClick={()=>onConfirm({ ...details, deliveryMethod, paymentSlip:"", paymentSlipName:"", paymentMethod, paymentStatus:"cod_pending" })} style={{ flex:2, padding:12, background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontSize:14, fontWeight:700, fontFamily:thF }}>{t.order.confirm}</button>
              ) : (
                <button type="button" onClick={()=>setStep(3)} style={{ flex:2, padding:12, background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontSize:14, fontWeight:700, fontFamily:thF }}>{lang==="th"?"แนบสลิป":"Upload slip"}</button>
              )}
            </div>
          </div>
        )}

        {step===3&&(
          <form className="checkout-form" onSubmit={handleSlipSubmit} style={{ display:"flex", flexDirection:"column", gap:14 }}>
            <div style={{ background:"#F8F7F4", border:"1px solid #ECECEC", borderRadius:12, padding:14 }}>
              <div style={{ fontWeight:800, fontSize:13, marginBottom:6 }}>{lang==="th"?"แนบสลิปโอนเงิน":"Upload payment slip"}</div>
              <div style={{ fontSize:12, color:"#666", lineHeight:1.5, marginBottom:10 }}>{paymentMethod==="bank_transfer" ? (lang==="th"?"เลือกรูปสลิปหลังจากโอนเงินผ่านบัญชีธนาคาร":"Choose the slip image after bank transfer.") : (lang==="th"?"เลือกรูปสลิปหลังจากชำระเงินผ่านพร้อมเพย์":"Choose the slip image after paying with PromptPay.")}</div>
              <input name="paymentSlip" type="file" accept="image/*" required style={{ fontSize:12, width:"100%" }} />
            </div>
            <div className="checkout-actions" style={{ display:"flex", gap:10, marginTop:4 }}>
              <button type="button" onClick={()=>setStep(2)} style={{ flex:1, padding:12, border:"1px solid #ddd", borderRadius:10, background:"#fff", cursor:"pointer", fontSize:14, fontFamily:thF }}>{lang==="th"?"กลับ":"Back"}</button>
              <button type="submit" style={{ flex:2, padding:12, background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontSize:14, fontWeight:700, fontFamily:thF }}>{t.order.confirm}</button>
            </div>
          </form>
        )}
      </SmoothSizeCard>
    </div>
  );
}

// ─── ACCOUNTS PANEL (owner only) ─────────────────────────────────────────────
function AccountsPanel({ accounts, setAccounts, currentUser, lang, onLog }) {
  const [newEmail, setNewEmail]     = useState("");
  const [newPw, setNewPw]           = useState("");
  const [newName, setNewName]       = useState("");
  const [newRole, setNewRole]       = useState("admin");
  const [formError, setFormError]   = useState("");
  const [showAdd, setShowAdd]       = useState(false);
  const thF = lang==="th" ? "'Sarabun','Helvetica Neue',Arial,sans-serif" : "'Helvetica Neue',Arial,sans-serif";

  const ROLE_COLORS = {
    owner:    { bg:"rgba(217,119,6,0.15)",   text:"#f59e0b", label: lang==="th"?"เจ้าของ":"Owner"   },
    admin:    { bg:"#fff",  text:"#1A1A1A", label: lang==="th"?"แอดมิน":"Admin"   },
    disabled: { bg:"rgba(239,68,68,0.12)",   text:"#ef4444", label: lang==="th"?"ระงับ":"Disabled" },
  };

  function addAccount() {
    setFormError("");
    if (!newEmail.trim() || !newPw.trim() || !newName.trim()) { setFormError(lang==="th"?"กรุณากรอกข้อมูลให้ครบ":"Please fill in all fields"); return; }
    if (accounts.find(a => a.email.toLowerCase()===newEmail.trim().toLowerCase())) { setFormError(lang==="th"?"อีเมลนี้มีในระบบแล้ว":"Email already exists"); return; }
    setAccounts(prev => [...prev, { id: Date.now(), email: newEmail.trim(), password: newPw.trim(), name: newName.trim(), role: newRole }]);
    onLog?.("account_add", `Added ${newName.trim()} (${newEmail.trim()}) as ${newRole}`);
    setNewEmail(""); setNewPw(""); setNewName(""); setNewRole("admin"); setShowAdd(false);
  }

  function changeRole(id, role) {
    // cannot change own role or demote another owner if you are owner (safety)
    if (id === currentUser.id) return;
    const account = accounts.find(a => a.id === id);
    setAccounts(prev => prev.map(a => a.id===id ? { ...a, role } : a));
    onLog?.("account_role", `Changed ${account?.email || "account"} role to ${role}`);
  }

  function removeAccount(id) {
    if (id === currentUser.id) return; // cannot remove yourself
    const account = accounts.find(a => a.id === id);
    setAccounts(prev => prev.filter(a => a.id !== id));
    onLog?.("account_remove", `Removed ${account?.email || "account"}`);
  }

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18 }}>
        <div>
          <h3 style={{ margin:"0 0 3px", fontSize:16, fontWeight:700, color:"#1A1A1A" }}>{lang==="th"?"จัดการบัญชีผู้ใช้":"Account Management"}</h3>
          <p style={{ margin:0, color:"#777", fontSize:13 }}>{lang==="th"?"เพิ่ม ลบ หรือเปลี่ยนสิทธิ์ผู้ใช้":"Add, remove or change user permissions"}</p>
        </div>
        <button onClick={()=>setShowAdd(s=>!s)} style={{ background:"#fff", color:"#1A1A1A", border:"1px solid #fff", borderRadius:10, padding:"9px 16px", cursor:"pointer", fontSize:13, fontWeight:600, fontFamily:thF }}>
          {showAdd ? "×" : (lang==="th"?"+ เพิ่มผู้ใช้":"+ Add User")}
        </button>
      </div>

      {/* Add user form */}
      {showAdd && (
        <div style={{ background:"#FAFAF8", border:"1px solid #ECECEC", borderRadius:13, padding:18, marginBottom:16 }}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))", gap:12, marginBottom:12 }}>
            {[
              [lang==="th"?"ชื่อ":"Name", newName, setNewName, "text", lang==="th"?"ชื่อผู้ใช้":"Display name"],
              [lang==="th"?"อีเมล":"Email", newEmail, setNewEmail, "email", "email@example.com"],
              [lang==="th"?"รหัสผ่าน":"Password", newPw, setNewPw, "password", "••••••••"],
            ].map(([label, val, setter, type, ph])=>(
              <div key={label}>
                <label style={{ fontSize:11, color:"#777", display:"block", marginBottom:5 }}>{label}</label>
                <input type={type} value={val} onChange={e=>setter(e.target.value)} placeholder={ph} style={{ ...iSDark, fontSize:13 }} />
              </div>
            ))}
            <div>
              <label style={{ fontSize:11, color:"#777", display:"block", marginBottom:5 }}>{lang==="th"?"สิทธิ์":"Role"}</label>
              <select value={newRole} onChange={e=>setNewRole(e.target.value)} style={{ ...iSDark, cursor:"pointer" }}>
                <option value="admin">{lang==="th"?"แอดมิน":"Admin"}</option>
                <option value="owner">{lang==="th"?"เจ้าของ":"Owner"}</option>
              </select>
            </div>
          </div>
          {formError && <p style={{ color:"#ef4444", fontSize:12, margin:"0 0 10px" }}>⚠ {formError}</p>}
          <button onClick={addAccount} style={{ background:"linear-gradient(135deg,#166534,#15803d)", color:"#fff", border:"none", borderRadius:9, padding:"9px 18px", cursor:"pointer", fontSize:13, fontWeight:600, fontFamily:thF }}>
            {lang==="th"?"บันทึก":"Save Account"}
          </button>
        </div>
      )}

      {/* Accounts list */}
      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {accounts.map(acc => {
          const rc = ROLE_COLORS[acc.role] || ROLE_COLORS.disabled;
          const isSelf = acc.id === currentUser.id;
          return (
            <div key={acc.id} style={{ background:"#FAFAF8", border:`1px solid ${isSelf?"#1A1A1A":"#ECECEC"}`, borderRadius:13, padding:"13px 16px", display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
              {/* Avatar */}
              <div style={{ width:38, height:38, borderRadius:"50%", background:"#1A1A1A", display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, fontWeight:700, color:"#fff", flexShrink:0 }}>
                {acc.name.charAt(0).toUpperCase()}
              </div>
              {/* Info */}
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                  <span style={{ fontWeight:700, fontSize:14, color:"#1A1A1A" }}>{acc.name}</span>
                  {isSelf && <span style={{ fontSize:10, color:"#1A1A1A", background:"#fff", borderRadius:20, padding:"2px 8px", fontWeight:600 }}>{lang==="th"?"คุณ":"You"}</span>}
                  <span style={{ background:rc.bg, color:rc.text, borderRadius:20, padding:"2px 9px", fontSize:10, fontWeight:700, letterSpacing:0.3 }}>{rc.label}</span>
                </div>
                <div style={{ fontSize:12, color:"#777", marginTop:2 }}>{acc.email}</div>
              </div>
              {/* Role changer — can't edit self */}
              {!isSelf && (
                <div style={{ display:"flex", gap:6, alignItems:"center", flexShrink:0 }}>
                  <select value={acc.role} onChange={e=>changeRole(acc.id,e.target.value)}
                    style={{ background:"#fff", border:"1px solid #E0DDD8", color:"#1A1A1A", borderRadius:8, padding:"6px 10px", fontSize:12, cursor:"pointer", outline:"none" }}>
                    <option value="owner">{lang==="th"?"เจ้าของ":"Owner"}</option>
                    <option value="admin">{lang==="th"?"แอดมิน":"Admin"}</option>
                    <option value="disabled">{lang==="th"?"ระงับ":"Disabled"}</option>
                  </select>
                  <button onClick={()=>removeAccount(acc.id)}
                    style={{ background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.2)", color:"#ef4444", borderRadius:8, padding:"6px 11px", cursor:"pointer", fontSize:12, fontWeight:600, fontFamily:thF }}>
                    {lang==="th"?"ลบ":"Remove"}
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <p style={{ marginTop:16, fontSize:11, color:"#1e293b", textAlign:"center", fontFamily:"monospace" }}>
        {lang==="th"?"เฉพาะเจ้าของเท่านั้นที่สามารถจัดการบัญชีได้ · คุณไม่สามารถแก้ไขบัญชีตัวเองได้":"Only owners can manage accounts · You cannot edit your own account"}
      </p>
    </div>
  );
}

// ─── INVENTORY PANEL ──────────────────────────────────────────────────────────
function InventoryPanel({ brands, setBrands, lang, t, onLog, hiddenPartTypes=[], setHiddenPartTypes=()=>{} }) {
  const ta  = t.admin;
  const thF = lang==="th" ? "'Sarabun','Helvetica Neue',Arial,sans-serif" : "'Helvetica Neue',Arial,sans-serif";

  const [search, setSearch]         = useState("");
  const [filter, setFilter]         = useState("all");
  const [selectedBrand, setSelectedBrand] = useState(null);
  const [selectedPartType, setSelectedPartType] = useState("all");
  const [loadingKey, setLoadingKey] = useState(null);
  const [editingKey, setEditingKey] = useState(null);
  const [editVal, setEditVal]       = useState("");
  const emptyProductForm = () => ({
    partType:selectedPartType==="all" ? "steering_rack" : selectedPartType,
    brandId:selectedBrand || brands[0]?.id || "",
    nameTh:"",
    nameEn:"",
    modelAliases:"",
    keywordsTh:"",
    keywordsEn:"",
    years:"",
    driveBody:"",
    price:"",
    stock:"",
    sku:"",
    driveSide:"right",
    imagePath:"",
    imageFileName:"",
    imageData:"",
    imageGallery:[],
    visible:"Yes",
  });
  const [productFormOpen, setProductFormOpen] = useState(false);
  const [productFormMode, setProductFormMode] = useState("add");
  const [editingProduct, setEditingProduct] = useState(null);
  const [productForm, setProductForm] = useState(emptyProductForm);
  const [toasts, setToasts]         = useState([]);
  const toastRef = useRef(0);
  const inputRef = useRef(null);
  const isPartSectionHidden = (partId) => hiddenPartTypes.includes(partId);

  useEffect(() => { if (editingKey && inputRef.current) inputRef.current.focus(); }, [editingKey]);

  const addToast = useCallback((msg, type="success") => {
    const id = ++toastRef.current;
    setToasts(p => [...p, { id, message:msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3200);
  }, []);

  const setFormField = (field, value) => setProductForm(prev => ({ ...prev, [field]:value }));
  const imageNameFromModel = (model) => {
    if (String(model.productImage || "").startsWith("data:")) return model.imageFileName || "";
    const raw = model.imageFileName || model.productImage || "";
    return String(raw).split(/[\\/]/).pop();
  };
  const productImagePath = (fileName) => {
    const cleaned = String(fileName || "").trim();
    if (!cleaned) return "";
    if (/^(https?:|data:|assets[\\/])/i.test(cleaned)) return cleaned.replace(/\\/g, "/");
    if (/^[a-z]:[\\/]/i.test(cleaned)) return `file:///${cleaned.replace(/\\/g, "/")}`;
    return `assets/${cleaned}`;
  };
  const parseImagePaths = (text) => String(text || "")
    .split(/[\n,]+/)
    .map(path => productImagePath(path))
    .filter(Boolean);
  const makeProductId = (brandId, sku, nameTh) => {
    const base = String(sku || nameTh || "product").toLowerCase().replace(/[^a-z0-9ก-๙]+/gi, "-").replace(/^-+|-+$/g, "") || "product";
    let id = `${brandId}-${base}`;
    let index = 2;
    const exists = (candidate) => brands.some(brand => brand.models.some(model => model.id === candidate && model.id !== editingProduct?.modelId));
    while (exists(id)) id = `${brandId}-${base}-${index++}`;
    return id;
  };
  const openAddProduct = () => {
    setProductFormMode("add");
    setEditingProduct(null);
    setProductForm(emptyProductForm());
    setProductFormOpen(true);
  };
  const openEditProduct = (p) => {
    setProductFormMode("edit");
    setEditingProduct({ brandId:p.brandId, modelId:p.id });
    setProductForm({
      partType:p.partType,
      brandId:p.brandId,
      nameTh:p.nameTh || "",
      nameEn:p.nameEn || "",
      modelAliases:splitAliasText(p.model_aliases || p.modelAliases).join(", "),
      keywordsTh:splitAliasText(p.keywords_th || p.keywordsTh).join(", "),
      keywordsEn:splitAliasText(p.keywords_en || p.keywordsEn).join(", "),
      years:p.years || "",
      driveBody:p.driveBody || "",
      price:String(p.price ?? ""),
      stock:String(p.stock ?? ""),
      sku:p.sku || "",
      driveSide:getModelDriveSide(p),
      imagePath:getModelGalleryImages(p).map(img => img.src || "").filter(src => src && !String(src).startsWith("data:")).join("\n"),
      imageFileName:imageNameFromModel(p),
      imageData:String(p.productImage || "").startsWith("data:") ? p.productImage : "",
      imageGallery:getModelGalleryImages(p),
      visible:p.hidden ? "No" : "Yes",
    });
    setProductFormOpen(true);
  };
  const closeProductForm = () => {
    setProductFormOpen(false);
    setProductFormMode("add");
    setEditingProduct(null);
    setProductForm(emptyProductForm());
  };
  const saveProductForm = () => {
    const brandId = productForm.brandId;
    const nameTh = productForm.nameTh.trim();
    const nameEn = productForm.nameEn.trim();
    const sku = productForm.sku.trim();
    const price = Number(productForm.price);
    const stock = parseInt(productForm.stock, 10);
    if (!brandId || !nameTh || !nameEn || !sku || !Number.isFinite(price) || price < 0 || isNaN(stock) || stock < 0) {
      addToast(lang==="th" ? "กรุณากรอกข้อมูลสินค้าให้ครบ" : "Please fill all required product fields", "error");
      return;
    }
    const skuUsed = brands.some(brand => brand.models.some(model =>
      String(model.sku || "").trim().toLowerCase() === sku.toLowerCase() &&
      !(productFormMode==="edit" && editingProduct && brand.id===editingProduct.brandId && model.id===editingProduct.modelId)
    ));
    if (skuUsed) {
      addToast(lang==="th" ? "SKU นี้มีอยู่แล้ว กรุณาใช้รหัสอื่น" : "This SKU already exists. Please use another code.", "error");
      return;
    }
    const galleryFromFileName = productForm.imageFileName.trim() ? [{ src:productImagePath(productForm.imageFileName), name:productForm.imageFileName.trim() }] : [];
    const galleryFromPath = parseImagePaths(productForm.imagePath).map(src => ({ src, name:String(src).split(/[\\/]/).pop() || src }));
    const gallerySeen = new Set();
    const galleryMerged = [...productForm.imageGallery, ...galleryFromPath].filter(img => {
      if (!img?.src || gallerySeen.has(img.src)) return false;
      gallerySeen.add(img.src);
      return true;
    });
    const galleryImages = galleryMerged.length > 0 ? galleryMerged : (productForm.imageData ? [{ src:productForm.imageData, name:productForm.imageFileName.trim() }] : galleryFromFileName);
    const mainImage = galleryImages[0]?.src || "";
    const mainImageName = galleryImages[0]?.name || productForm.imageFileName.trim();
    const nextModel = {
      id: productFormMode==="edit" ? editingProduct.modelId : makeProductId(brandId, sku, nameTh),
      nameTh,
      nameEn,
      sku,
      years:productForm.years.trim(),
      driveBody:productForm.driveBody.trim(),
      price,
      stock,
      partType:productForm.partType,
      driveSide:productForm.driveSide,
      productImage:mainImage,
      productImages:galleryImages,
      imageFileName:mainImageName,
      hidden:productForm.visible === "No",
      name_th:nameTh,
      name_en:nameEn,
      brand_th:(BRAND_I18N[brandId]?.th || brands.find(b=>b.id===brandId)?.nameTh || ""),
      brand_en:(BRAND_I18N[brandId]?.en || brands.find(b=>b.id===brandId)?.nameEn || ""),
      model_th:nameTh,
      model_en:nameEn,
      model_aliases:splitAliasText(productForm.modelAliases),
      part_type_th:partTypeText(productForm.partType, "th"),
      part_type_en:partTypeText(productForm.partType, "en"),
      keywords_th:splitAliasText(productForm.keywordsTh),
      keywords_en:splitAliasText(productForm.keywordsEn),
    };
    setBrands(prev => {
      if (productFormMode === "edit" && editingProduct) {
        return prev.map(brand => {
          const withoutEdited = brand.models.filter(model => !(brand.id === editingProduct.brandId && model.id === editingProduct.modelId));
          if (brand.id !== brandId) return { ...brand, models:withoutEdited };
          return { ...brand, models:[...withoutEdited, nextModel] };
        });
      }
      return prev.map(brand => brand.id === brandId ? { ...brand, models:[...brand.models, nextModel] } : brand);
    });
    setSelectedBrand(brandId);
    setSelectedPartType(productForm.partType);
    setSearch("");
    addToast(productFormMode==="edit"
      ? (lang==="th" ? "แก้ไขสินค้าแล้ว" : "Product updated")
      : (lang==="th" ? "เพิ่มสินค้าใหม่แล้ว" : "Product added"));
    onLog?.(productFormMode==="edit" ? "product_edit" : "product_add", `${productFormMode==="edit" ? "Edit" : "Add"} ${nameTh} (${sku})`);
    closeProductForm();
  };
  const handleProductPhotoUpload = async (files) => {
    const list = Array.from(files || []).filter(Boolean);
    if (list.length === 0) return;
    if (list.some(file => !file.type.startsWith("image/"))) {
      addToast(lang==="th" ? "กรุณาเลือกรูปภาพสินค้า" : "Please choose a product image", "error");
      return;
    }
    const uploaded = [];
    for (const file of list) {
      const imageData = await readSlipFile(file);
      if (imageData) uploaded.push({ src:imageData, name:file.name });
    }
    setProductForm(prev => ({
      ...prev,
      imageData:uploaded[0]?.src || prev.imageData,
      imageFileName:prev.imageFileName || uploaded[0]?.name || "",
      imageGallery:[...prev.imageGallery, ...uploaded],
    }));
  };

  const addImageFileNameToGallery = () => {
    const name = productForm.imageFileName.trim();
    if (!name) {
      addToast(lang==="th" ? "กรุณาใส่ชื่อไฟล์รูปก่อน" : "Please type an image file name first", "error");
      return;
    }
    const src = productImagePath(name);
    setProductForm(prev => prev.imageGallery.some(img => img.src === src)
      ? prev
      : { ...prev, imageGallery:[...prev.imageGallery, { src, name }] });
  };

  const addImagePathsToGallery = () => {
    const paths = parseImagePaths(productForm.imagePath);
    if (paths.length === 0) {
      addToast(lang==="th" ? "กรุณาใส่ path รูปสินค้า" : "Please add an image path", "error");
      return;
    }
    setProductForm(prev => {
      const existing = new Set(prev.imageGallery.map(img => img.src));
      const nextImages = paths
        .filter(src => !existing.has(src))
        .map(src => ({ src, name:String(src).split(/[\\/]/).pop() || src }));
      return nextImages.length === 0 ? prev : { ...prev, imageGallery:[...prev.imageGallery, ...nextImages] };
    });
  };

  const removeGalleryImage = (index) => {
    setProductForm(prev => ({ ...prev, imageGallery:prev.imageGallery.filter((_, i) => i !== index) }));
  };

  const moveGalleryImage = (index, delta) => {
    setProductForm(prev => {
      const nextIndex = index + delta;
      if (nextIndex < 0 || nextIndex >= prev.imageGallery.length) return prev;
      const next = [...prev.imageGallery];
      const [item] = next.splice(index, 1);
      next.splice(nextIndex, 0, item);
      return { ...prev, imageGallery:next };
    });
  };

  const allProducts = brands.flatMap(b =>
    b.models.map(m => ({
      ...m, brandId:b.id, brandLogo:b.logo,
      brandNameTh:b.nameTh, brandNameEn:b.nameEn,
      partType:getModelPartType(m),
      partTypeLabel:getPartTypeLabel(getModelPartType(m), lang),
      hidden:!!m.hidden,
      key:`${b.id}__${m.id}`,
      displayName: lang==="th" ? `${b.nameTh} ${m.nameTh}` : `${b.nameEn} ${m.nameEn}`,
      displayModel: lang==="th" ? m.nameTh : m.nameEn,
    }))
  );
  const noPhotoProducts = allProducts.filter(p => !productHasPhoto(p));
  const visibleNoPhotoProducts = noPhotoProducts.filter(p => !p.hidden);
  const hiddenNoPhotoProducts = noPhotoProducts.filter(p => p.hidden);
  const partProducts = selectedPartType === "all" ? allProducts : allProducts.filter(p => p.partType === selectedPartType);

  const filtered = partProducts.filter(p => {
    const q = search.toLowerCase();
    const searchStr = `${p.brandNameTh} ${p.brandNameEn} ${p.nameTh} ${p.nameEn} ${p.partTypeLabel} ${p.sku}`.toLowerCase();
    const productBrand = brands.find(brand => brand.id === p.brandId);
    if (q && !searchStr.includes(q) && !productMatchesQuery(productBrand, p, q)) return false;
    if (selectedBrand && p.brandId !== selectedBrand) return false;
    if (filter==="out") return p.stock===0;
    if (filter==="low") return p.stock>0 && p.stock<=15;
    if (filter==="ok")  return p.stock>15;
    if (filter==="hidden") return p.hidden;
    if (filter==="no_photo") return !productHasPhoto(p);
    return true;
  });

  const updateStock = useCallback(async (key, brandId, modelId, newStock, displayName) => {
    setLoadingKey(key);
    await new Promise(r => setTimeout(r, 380));
    setBrands(prev => prev.map(b =>
      b.id!==brandId ? b : { ...b, models: b.models.map(m => m.id!==modelId ? m : { ...m, stock:newStock }) }
    ));
    setLoadingKey(null);
    const short = displayName.length>28 ? displayName.slice(0,28)+"…" : displayName;
    addToast(`"${short}" → ${newStock} ${ta.invUnits}`);
    onLog?.("stock_update", `Set ${displayName} stock to ${newStock}`);
  }, [setBrands, addToast, ta.invUnits, onLog]);

  const adjust = useCallback((p, delta) => {
    const next = Math.max(0, p.stock + delta);
    if (next===p.stock && delta<0) { addToast(ta.invBelowZero, "error"); return; }
    updateStock(p.key, p.brandId, p.id, next, p.displayName);
  }, [updateStock, addToast, ta.invBelowZero]);

  const commitEdit = useCallback((p) => {
    const v = parseInt(editVal, 10);
    if (isNaN(v) || v<0) { addToast(ta.invInvalid, "error"); setEditingKey(null); return; }
    updateStock(p.key, p.brandId, p.id, Math.max(0,v), p.displayName);
    setEditingKey(null);
  }, [editVal, updateStock, addToast, ta.invInvalid]);

  const toggleHidden = useCallback((p) => {
    const nextHidden = !p.hidden;
    setBrands(prev => prev.map(b =>
      b.id!==p.brandId ? b : { ...b, models: b.models.map(m => m.id!==p.id ? m : { ...m, hidden:nextHidden }) }
    ));
    addToast(nextHidden
      ? (lang==="th" ? "ซ่อนสินค้าจากหน้าลูกค้าแล้ว" : "Product hidden from customers")
      : (lang==="th" ? "แสดงสินค้าหน้าลูกค้าแล้ว" : "Product visible to customers"));
    onLog?.("product_visibility", `${nextHidden ? "Hide" : "Show"} ${p.displayName}`);
  }, [setBrands, addToast, lang, onLog]);

  const setNoPhotoProductsHidden = useCallback((hidden) => {
    const affected = noPhotoProducts.filter(p => p.hidden !== hidden);
    if (affected.length === 0) {
      addToast(hidden
        ? (lang==="th" ? "ไม่มีสินค้าที่ไม่มีรูปให้ซ่อนแล้ว" : "No photo-less products left to hide")
        : (lang==="th" ? "ไม่มีสินค้าที่ไม่มีรูปซ่อนอยู่" : "No hidden photo-less products"));
      return;
    }
    const affectedKeys = new Set(affected.map(p => p.key));
    setBrands(prev => prev.map(b => ({
      ...b,

function readDatabaseConfig() {

  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("skkj_v2_database_config_v1") || "{}"); } catch (error) {}
  const config = {
    ...SKKJ_DATABASE_CONFIG,
    ...saved,
    enabled: url.searchParams.get("skkjDb") === "1" || saved.enabled === true || SKKJ_DATABASE_CONFIG.enabled === true,
    provider: url.searchParams.get("skkjDbProvider") || saved.provider || SKKJ_DATABASE_CONFIG.provider || "server",
    apiBase: url.searchParams.get("skkjApi") || saved.apiBase || SKKJ_DATABASE_CONFIG.apiBase || "",
    adminToken: "",
    supabaseUrl: url.searchParams.get("skkjSupabaseUrl") || saved.supabaseUrl || SKKJ_DATABASE_CONFIG.supabaseUrl || "",
    supabaseKey: url.searchParams.get("skkjSupabaseKey") || saved.supabaseKey || SKKJ_DATABASE_CONFIG.supabaseKey || "",
    supabaseTable: url.searchParams.get("skkjSupabaseTable") || saved.supabaseTable || SKKJ_DATABASE_CONFIG.supabaseTable || "skkj_site_state",
    supabaseRecordId: url.searchParams.get("skkjSupabaseRecord") || saved.supabaseRecordId || SKKJ_DATABASE_CONFIG.supabaseRecordId || "main",
  };
  if (url.searchParams.has("skkjDb") || url.searchParams.has("skkjApi") || url.searchParams.has("skkjSupabaseUrl") || url.searchParams.has("skkjSupabaseKey")) {
    try {
      localStorage.setItem("skkj_v2_database_config_v1", JSON.stringify({
        enabled: config.enabled,
        provider: config.provider,
        apiBase: config.apiBase,
        adminToken: "",
        supabaseUrl: config.supabaseUrl,
        supabaseKey: config.supabaseKey,
        supabaseTable: config.supabaseTable,
        supabaseRecordId: config.supabaseRecordId,
      }));
    } catch (error) {}
  }
  return config;
}

async function skkjDatabaseRequest(config, path, options = {}) {
  if (config.provider === "supabase") return skkjSupabaseRequest(config, path, options);
  const headers = { "Content-Type":"application/json", ...(options.headers || {}) };
  // Private API tokens must be attached by backend/serverless functions only.
  // Never store admin, OpenAI, service-role, or webhook secrets in browser code.
  const response = await fetch(`${config.apiBase}${path}`, {
    ...options,
    headers,
    body: options.body && typeof options.body !== "string" ? JSON.stringify(options.body) : options.body,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok === false) throw new Error(data.error || "Database request failed");
  return data;
}

async function skkjSupabaseRequest(config, path, options = {}) {
  if (!config.supabaseUrl || !config.supabaseKey) throw new Error("Supabase URL or key is missing");
  const table = encodeURIComponent(config.supabaseTable || "skkj_site_state");
  const recordId = encodeURIComponent(config.supabaseRecordId || "main");
  const baseUrl = String(config.supabaseUrl).replace(/\/+$/, "");
  const headers = {
    "Content-Type":"application/json",
    "apikey":config.supabaseKey,
    "Authorization":`Bearer ${config.supabaseKey}`,
    ...(options.headers || {}),
  };

  if (path === "/api/state" && (!options.method || options.method === "GET")) {
    const response = await fetch(`${baseUrl}/rest/v1/${table}?id=eq.${recordId}&select=state,updated_at`, { headers });
    const data = await response.json().catch(() => []);
    if (!response.ok) throw new Error(data?.message || "Supabase load failed");
    const row = Array.isArray(data) ? data[0] : null;
    return { ok:true, state:row?.state || null, updatedAt:row?.updated_at || "" };
  }

  if (path === "/api/state" && options.method === "PUT") {
    const state = options.body?.state || options.body || {};
    const response = await fetch(`${baseUrl}/rest/v1/${table}`, {
      method:"POST",
      headers:{ ...headers, "Prefer":"resolution=merge-duplicates,return=minimal" },
      body:JSON.stringify({ id:config.supabaseRecordId || "main", state, updated_at:new Date().toISOString() }),
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data?.message || "Supabase save failed");
    }
    return { ok:true };
  }

  throw new Error("Unsupported Supabase database path");
}

async function skkjSupabaseTableRequest(config, tableName, options = {}) {
  if (!config?.supabaseUrl || !config?.supabaseKey) throw new Error("Supabase URL or key is missing");
  const baseUrl = String(config.supabaseUrl).replace(/\/+$/, "");
  const query = options.query ? String(options.query) : "";
  const headers = {
    "Content-Type":"application/json",
    "apikey":config.supabaseKey,
    "Authorization":`Bearer ${config.supabaseKey}`,
    ...(options.prefer ? { "Prefer":options.prefer } : {}),
    ...(options.headers || {}),
  };
  const response = await fetch(`${baseUrl}/rest/v1/${encodeURIComponent(tableName)}${query}`, {
    method:options.method || "GET",
    headers,
    body:options.body === undefined ? undefined : JSON.stringify(options.body),
  });
  const data = await response.json().catch(() => null);
  if (!response.ok) throw new Error(data?.message || `${tableName} request failed`);
  return data;
}

const cleanText = (value, max = 500) => String(value || "").replace(/[<>]/g, "").trim().slice(0, max);

const stableTextId = (prefix, value) => `${prefix}_${String(value || "unknown").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 80) || "unknown"}`;

function normalizeDatabaseState(state) {
  if (!state || typeof state !== "object") return {};
  return {
    brands: Array.isArray(state.brands) ? state.brands : null,
    orders: Array.isArray(state.orders) ? state.orders : null,
    customers: Array.isArray(state.customers) ? state.customers : null,
    accounts: Array.isArray(state.accounts) ? state.accounts : null,
    hiddenPartTypes: Array.isArray(state.hiddenPartTypes) ? state.hiddenPartTypes : null,
    activityLog: Array.isArray(state.activityLog) ? state.activityLog : null,
    analytics: Array.isArray(state.analytics) ? state.analytics : null,
    syncEvents: Array.isArray(state.syncEvents) ? state.syncEvents : null,
    updatedAt: state.updatedAt || null,
  };
}

function makeDatabaseState({ brands, orders, customers, accounts, hiddenPartTypes, activityLog, analytics, syncEvents }) {
  return {
    version: 2,
    savedFrom: "skkj-version-2",
    updatedAt: new Date().toISOString(),
    brands,
    orders,
    customers,
    accounts,
    hiddenPartTypes,
    activityLog,
    analytics,
    syncEvents: Array.isArray(syncEvents) ? syncEvents.slice(0, 500) : [],
  };
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error:null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("SKKJ caught:", error, info); }
  render() {
    if (this.state.error) {
      return React.createElement("div", { style:{ fontFamily:"Arial,sans-serif", padding:"40px 24px", maxWidth:700, margin:"0 auto", color:"#1A1A1A" } },
        React.createElement("h2", { style:{ color:"#9A0018" } }, "ระบบมีปัญหาชั่วคราว / Temporary issue"),
        React.createElement("p", { style:{ color:"#666", lineHeight:1.6 } }, "กรุณารีเฟรชหน้าใหม่ หรือติดต่อทาง LINE / Please refresh or contact us on LINE."),
        React.createElement("button", { onClick:()=>{ try{localStorage.clear();}catch(e){} window.location.reload(); }, style:{ marginTop:12, background:"#1A1A1A", color:"#fff", border:"none", borderRadius:10, padding:"12px 18px", fontSize:14, fontWeight:700, cursor:"pointer" } }, "ล้างข้อมูลและรีเฟรช / Reset & Refresh"),
        React.createElement("pre", { style:{ marginTop:20, background:"#FAFAF8", border:"1px solid #eee", borderRadius:8, padding:12, fontSize:11, color:"#999", overflow:"auto", whiteSpace:"pre-wrap" } }, String(this.state.error && this.state.error.stack || this.state.error))
      );
    }
    return this.props.children;
  }
}

  function makeOnlineSyncEvent(reason = "manual_save", overrides = {}) {
    const orderList = Array.isArray(overrides.orders) ? overrides.orders : orders;
    const brandList = Array.isArray(overrides.brands) ? overrides.brands : brands;
    const productCount = Array.isArray(brandList)

      : 0;
    return {
      id: `SYNC-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      reason,
      at: new Date().toISOString(),
      actor: currentUser?.email || currentCustomer?.email || currentCustomer?.phone || "website",
      actorRole: currentUser?.role || (currentCustomer ? "customer" : "guest"),
      changed: {
        brands: Array.isArray(overrides.brands),

        accounts: Array.isArray(overrides.accounts),

  function queueImmediateOnlineSave(reason = "manual_save", overrides = {}) {
    const config = dbConfigRef.current;
    if (!hasOnlineDatabaseTarget(config) || !dbLoadedRef.current) return;
    if (dbSaveTimerRef.current) clearTimeout(dbSaveTimerRef.current);
    const nextSyncEvents = [
      makeOnlineSyncEvent(reason, overrides),
      ...(Array.isArray(overrides.syncEvents) ? overrides.syncEvents : syncEvents),
    ].slice(0, 500);
    setSyncEvents(nextSyncEvents);
    syncBusinessTables(reason, overrides);
    const state = makeDatabaseState({
      brands: overrides.brands || brands,
      orders: overrides.orders || orders,
      customers: overrides.customers || customers,
      accounts: overrides.accounts || accounts,
      hiddenPartTypes: overrides.hiddenPartTypes || hiddenPartTypes,
      activityLog: overrides.activityLog || activityLog,
      analytics: overrides.analytics || analytics,
      syncEvents: nextSyncEvents,
    });
    state.lastOnlineAction = {
      reason,

    setDbStatus(prev => ({ ...prev, saving:true, error:"" }));

  async function upsertBusinessRows(tableName, rows, scope) {
    const config = dbConfigRef.current;
    const list = (Array.isArray(rows) ? rows : [rows]).filter(Boolean);
    if (!list.length || !canUseBusinessTables(config)) return;
    try {
      await skkjSupabaseTableRequest(config, tableName, {
        method:"POST",
        prefer:"resolution=merge-duplicates,return=minimal",
        body:list,
      });
    } catch (error) {
      reportBusinessSyncError(scope || tableName, error);

  function reduceStockForOrder(items, onlineOverrides = {}) {
    const nextBrands = brands.map(brand => ({
      ...brand,
      models: brand.models.map(model => {

          .filter(item => item.brandId === brand.id && item.modelId === model.id)
          .reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
        return ordered > 0 ? { ...model, stock:Math.max(0, model.stock - ordered) } : model;

    }));

      unitPrice: quantity > 0 ? Math.round(price / quantity) : price,

  function buildShippingRecord(order, previous = {}, options = {}) {

    return {
      id: previous.id || `SHIP-${order?.id || Date.now()}`,
      orderId: order?.id || "",
      createdAt: previous.createdAt || order?.createdAt || now,
      updatedAt: now,
      printedAt: options.printed ? now : (order?.labelPrintedAt || previous.printedAt || ""),
      printedCount,
      sender: {
        name: "SKKJ Autopart",
        phone: previous.sender?.phone || "",
        address: "86/111 หมู่ที่ 7 แขวงแสมดำ เขตบางขุนเทียน กรุงเทพมหานคร 10150",
      },
      receiver: {
        name: order?.customer || "",
        phone: order?.phone || "",
        email: order?.customerEmail || "",
        address: order?.address || "",
      },
      delivery: {
        method: order?.deliveryMethod || "standard",
        methodLabel: deliveryMethodLabel(order?.deliveryMethod),
        company: order?.shippingCompany || "",
        trackingNumber: order?.trackingNumber || "",
        labelPrinted: order?.labelPrinted === true || options.printed === true,
      },
      payment: {
        method: order?.paymentMethod || "",
        methodLabel: paymentMethodLabel(order?.paymentMethod),
        status: order?.paymentStatus || "waiting_review",
        statusLabel: ta.paymentLabels?.[order?.paymentStatus || "waiting_review"] || order?.paymentStatus || "waiting_review",
        total: Number(order?.price || 0),
        codAmount: order?.paymentMethod === "cod" ? Number(order?.price || 0) : 0,
      },
      items: orderItemsForShippingRecord(order),
      customerNote: order?.customerNote || "",
      adminNote: order?.adminNote || "",
    };
  }

  function attachShippingRecord(order, options = {}) {

  // ── UNIFIED LOGIN: tries staff first, then customer ──
  function normalizePhone(value) {
    return String(value || "").replace(/\D/g, "");
  }

  function handleLogin() {
    setAuthError("");
    const loginId = authEmail.trim();
    const email = loginId.toLowerCase();
    const phone = normalizePhone(loginId);
    const pw = authPw.trim();
    if (!loginId || !pw) { setAuthError(t.auth.fillAll); return; }

    // Check staff accounts first
    const staffAccount = accounts.find(a => a.email.toLowerCase() === email);
    if (staffAccount) {
      if (staffAccount.role === "disabled") { setAuthError(t.auth.disabled); return; }
      if (staffAccount.password !== pw)     { setAuthError(t.auth.wrongCredentials); return; }
      setCurrentUser(staffAccount);
      setAdminAuth(true);
      authRemember ? rememberLogin("staff", staffAccount.email) : forgetLogin();
      setLoginOpen(false);
      resetAuthForm();
      setPage("admin");
      return;
    }

    // Check customer accounts by email or phone number
    const customer = customers.find(c =>
      (c.email && c.email.toLowerCase() === email) ||
      (phone && normalizePhone(c.phone) === phone)
    );
    if (!customer)          { setAuthError(t.auth.wrongCredentials); return; }
    if (customer.password !== pw) { setAuthError(t.auth.wrongCredentials); return; }
    const onlineCustomer = normalizeCustomerOnlineProfile({ ...customer, lastLoginAt:new Date().toISOString() });
    const nextCustomers = customers.map(c => c.id === onlineCustomer.id ? onlineCustomer : c);
    setCustomers(nextCustomers);
    setCurrentCustomer(onlineCustomer);
    queueImmediateOnlineSave("customer_login_remembered_online", { customers: nextCustomers });
    authRemember ? rememberLogin("customer", onlineCustomer.email || onlineCustomer.phone) : forgetLogin();
    setLoginOpen(false);
    resetAuthForm();

  function handleRegister() {
    setAuthError("");
    const email = authEmail.trim().toLowerCase();
    const phone = normalizePhone(authPhone);
    if (!authName.trim() || !authPw.trim() || (!email && !phone)) { setAuthError(t.auth.fillAll); return; }
    if (email && (accounts.find(a => a.email.toLowerCase()===email) || customers.find(c => c.email && c.email.toLowerCase()===email))) {
      setAuthError(t.auth.emailExists); return;
    }
    if (phone && customers.find(c => normalizePhone(c.phone)===phone)) {
      setAuthError(lang==="th" ? "เบอร์โทรนี้มีในระบบแล้ว" : "This phone number already has an account"); return;
    }
    const newCustomer = normalizeCustomerOnlineProfile({
      id: "C" + String(customers.length + 1).padStart(3,"0"),
      email: authEmail.trim(),
      password: authPw.trim(),
      name: authName.trim(),
      phone: authPhone.trim(),
      joinDate: new Date().toISOString().slice(0,10),
      addresses:[],
      favorites:[],
      savedCars:[],
      createdAt:new Date().toISOString(),
      lastLoginAt:new Date().toISOString(),
    });
    const nextCustomers = [...customers, newCustomer];
    setCustomers(nextCustomers);
    setCurrentCustomer(newCustomer);
    queueImmediateOnlineSave("customer_registered_online", { customers: nextCustomers });
    authRemember ? rememberLogin("customer", newCustomer.email || newCustomer.phone) : forgetLogin();
    setLoginOpen(false);
    resetAuthForm();
  }

  function handleLogout() {
    forgetLogin();
    setCurrentCustomer(null);
    setCurrentUser(null);
    setAdminAuth(false);
    setAdminEmail("");
    setAdminPw("");
    if (page === "admin") setPage("home");

  function adminLogin(e) {
    if (e && e.preventDefault) e.preventDefault();
    const email = adminEmail.trim().toLowerCase();
    const pw    = adminPw.trim();
    if (!email || !pw) { setAdminError(lang==="th"?"กรุณากรอกอีเมลและรหัสผ่าน":"Please enter email and password"); return; }
    const account = accounts.find(a => a.email.toLowerCase() === email);
    if (!account)                  { setAdminError(lang==="th"?"ไม่พบอีเมลนี้ในระบบ":"Email not found"); return; }
    if (account.role==="disabled") { setAdminError(lang==="th"?"บัญชีนี้ถูกระงับการใช้งาน":"This account has been disabled"); return; }
    if (account.password !== pw)   { setAdminError(lang==="th"?"รหัสผ่านไม่ถูกต้อง":"Incorrect password"); return; }
    setCurrentUser(account);
    setAdminAuth(true);
    authRemember ? rememberLogin("staff", account.email) : forgetLogin();
    setAdminError("");
    setAdminEmail("");
    setAdminPw("");
  }

  function adminLogout() {
    forgetLogin();
    setAdminAuth(false);
    setCurrentUser(null);
    setAdminPw("");
    setAdminEmail("");
  }

    setAuthEmail(""); setAuthPw(""); setAuthName(""); setAuthPhone(""); setAuthError(""); setAuthMode("login");

  function makeOrderEvent(type, text) {
    return {
      id: Date.now() + Math.random(),
      type,
      text,
      user: currentUser?.name || currentUser?.email || (lang==="th" ? "แอดมิน" : "Admin"),
      date: new Date().toLocaleString(lang==="th" ? "th-TH" : "en-US"),
    };
  }

  function orderTimeline(order) {
    const existing = Array.isArray(order?.timeline) ? order.timeline : [];
    if (existing.length > 0) return existing;
    if (!order?.id) return [];
    return [{
      id:`created-${order.id}`,
      type:"created",
      text:lang==="th" ? "สร้างคำสั่งซื้อ" : "Order created",
      user:order.customer || (lang==="th" ? "ลูกค้า" : "Customer"),
      date:order.date || "-",
    }];
  }

  function appendOrderTimeline(orderId, event) {
    if (!orderId || !event) return;
    const changedAt = new Date().toISOString();
    const nextOrders = orders.map(o=>o.id===orderId ? { ...o, updatedAt:changedAt, timeline:[event, ...(Array.isArray(o.timeline) ? o.timeline : [])].slice(0, 80) } : o);
    setOrders(nextOrders);
    queueImmediateOnlineSave("order_timeline_updated", { orders: nextOrders });
    setDetailOrder(prev=>prev && prev.id===orderId ? { ...prev, updatedAt:changedAt, timeline:[event, ...(Array.isArray(prev.timeline) ? prev.timeline : [])].slice(0, 80) } : prev);
  }

  function addManualOrderTimelineNote(order) {
    const text = orderTimelineNote.trim();
    if (!order || !text) return;
    appendOrderTimeline(order.id, makeOrderEvent("note", text));
    setOrderTimelineNote("");
    logActivity("order_note", `Added private note to ${order.id}: ${text}`);
  }

  function saveEditOrder() {
    const event = makeOrderEvent("edit", lang==="th" ? "แก้ไขรายละเอียดคำสั่งซื้อ" : "Edited order details");
    const changedAt = new Date().toISOString();
    const nextEditOrder = attachShippingRecord({ ...editOrder, updatedAt:changedAt, timeline:[event, ...(Array.isArray(editOrder.timeline) ? editOrder.timeline : [])].slice(0, 80) });
    const nextOrders = orders.map(o=>o.id===editOrder.id?nextEditOrder:o);
    setOrders(nextOrders);
    queueImmediateOnlineSave("order_edited", { orders: nextOrders });
    setDetailOrder(prev=>prev && prev.id===editOrder.id ? nextEditOrder : prev);
    logActivity("order_edit", `Edited order ${editOrder.id}`);
    setEditOrder(null);
  }

    const id = "ORD-"+String(orders.length+1).padStart(3,"0");

    setOrders(nextOrders);
    queueImmediateOnlineSave("admin_manual_order_created", { orders: nextOrders });
    sendOrdersToGoogleSheet(manualOrder, "admin_manual_order");
    logActivity("order_add", `Added manual order for ${newOrder.customer || "customer"}`);
    setNewOrderModal(false);
    setNewOrder({ customer:"", brand:"", model:"", year:"", price:"", phone:"", address:"", customerNote:"", adminNote:"", shippingCompany:"", trackingNumber:"", status:"pending", paymentStatus:"waiting_review", adminFlag:"none" });
  }

    const newId = "ORD-"+String(orders.length+1).padStart(3,"0");
    const duplicatedOrder = attachShippingRecord({
      ...order,
      id:newId,
      date:new Date().toISOString().slice(0,10),
      status:"pending",
      paymentSlip:"",
      paymentSlipName:"",
      paymentStatus:"waiting_review",
      adminFlag:"none",
      labelPrinted:false,
      shippingCompany:"",

  function updateOrderStatus(order, status) {
    if (!order || order.status === status) return;
    const event = makeOrderEvent("status", lang==="th" ? `เปลี่ยนสถานะจาก ${ta.statusLabels[order.status] || order.status} เป็น ${ta.statusLabels[status] || status}` : `Changed status from ${ta.statusLabels[order.status] || order.status} to ${ta.statusLabels[status] || status}`);
    const changedAt = new Date().toISOString();
    const nextOrders = orders.map(o=>o.id===order.id?attachShippingRecord({...o,status,statusUpdatedAt:changedAt,updatedAt:changedAt,timeline:[event, ...(Array.isArray(o.timeline) ? o.timeline : [])].slice(0, 80)}):o);
    setOrders(nextOrders);
    queueImmediateOnlineSave("order_status_changed", { orders: nextOrders });
    setDetailOrder(prev=>prev && prev.id===order.id ? attachShippingRecord({...prev,status,statusUpdatedAt:changedAt,updatedAt:changedAt,timeline:[event, ...(Array.isArray(prev.timeline) ? prev.timeline : [])].slice(0, 80)}) : prev);
    logActivity("order_status", `Changed ${order.id} from ${ta.statusLabels[order.status] || order.status} to ${ta.statusLabels[status] || status}`);
  }

  function updatePaymentStatus(order, paymentStatus) {
    const currentPayment = order?.paymentStatus || "waiting_review";
    if (!order || currentPayment === paymentStatus) return;
    const event = makeOrderEvent("payment", lang==="th" ? `เปลี่ยนการชำระเงินจาก ${ta.paymentLabels[currentPayment] || currentPayment} เป็น ${ta.paymentLabels[paymentStatus] || paymentStatus}` : `Changed payment from ${ta.paymentLabels[currentPayment] || currentPayment} to ${ta.paymentLabels[paymentStatus] || paymentStatus}`);
    const changedAt = new Date().toISOString();
    const nextOrders = orders.map(o=>o.id===order.id?attachShippingRecord({...o,paymentStatus,paymentUpdatedAt:changedAt,updatedAt:changedAt,timeline:[event, ...(Array.isArray(o.timeline) ? o.timeline : [])].slice(0, 80)}):o);
    setOrders(nextOrders);
    queueImmediateOnlineSave("payment_status_changed", { orders: nextOrders });
    setDetailOrder(prev=>prev && prev.id===order.id ? attachShippingRecord({...prev,paymentStatus,paymentUpdatedAt:changedAt,updatedAt:changedAt,timeline:[event, ...(Array.isArray(prev.timeline) ? prev.timeline : [])].slice(0, 80)}) : prev);
    logActivity("payment_status", `Changed ${order.id} payment from ${ta.paymentLabels[currentPayment] || currentPayment} to ${ta.paymentLabels[paymentStatus] || paymentStatus}`);
  }

  function updateOrderFlag(order, adminFlag) {
    const currentFlag = order?.adminFlag || "none";
    if (!order || currentFlag === adminFlag) return;
    const event = makeOrderEvent("flag", lang==="th" ? `เปลี่ยนธงแอดมินจาก ${orderFlagLabel(currentFlag)} เป็น ${orderFlagLabel(adminFlag)}` : `Changed admin flag from ${orderFlagLabel(currentFlag)} to ${orderFlagLabel(adminFlag)}`);
    const changedAt = new Date().toISOString();
    const nextOrders = orders.map(o=>o.id===order.id?attachShippingRecord({...o,adminFlag,flagUpdatedAt:changedAt,updatedAt:changedAt,timeline:[event, ...(Array.isArray(o.timeline) ? o.timeline : [])].slice(0, 80)}):o);

    queueImmediateOnlineSave("order_flag_changed", { orders: nextOrders });
